name: 第17期 · 本期视频取帧封面
on:
  push:
    branches: [arena/8d7fb4aa-desktop-tutorial]
    paths: [production/shibuya2006/COVER_REQUEST]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cover:
    if: github.ref == 'refs/heads/arena/8d7fb4aa-desktop-tutorial'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/8d7fb4aa-desktop-tutorial
      - name: Install image and video decoder
        run: python -m pip install pillow fonttools av
      - name: Download hash-bound current episode shot and extract frame
        run: |
          python - <<'PY'
          import av, hashlib, json, urllib.request
          from pathlib import Path
          root=Path('production/shibuya2006')
          row=json.loads((root/'results.json').read_text())['shots']['S17']
          assert row['status']=='completed'
          dest=Path('work/shibuya2006/cover-source.mp4');dest.parent.mkdir(parents=True,exist_ok=True)
          urllib.request.urlretrieve(row['video_url'],dest)
          assert hashlib.sha256(dest.read_bytes()).hexdigest()==row['sha256']
          with av.open(str(dest)) as video:
              frame=next(f for f in video.decode(video=0) if float(f.time or 0)>=0.5)
              actual_time=float(frame.time)
              shot=root/'qa/cover-source-S17.jpg';frame.to_image().save(shot,quality=96)
          (root/'qa/cover-frame-provenance.json').write_text(json.dumps({'shot':'S17','source_sha256':row['sha256'],'source_url':row['video_url'],'frame_time':actual_time,'frame_sha256':hashlib.sha256(shot.read_bytes()).hexdigest(),'review':'current episode generated shot; cover pending visual review; not historical footage'},ensure_ascii=False,indent=2)+'\n')
          PY
          python production/mystery-cover-template/generate_cover.py --episode 17 --line1 '妹妹遇害第二天' --line2 '他照常参加集训' --screenshot production/shibuya2006/qa/cover-source-S17.jpg --release-title '妹妹遇害第二天，他照常参加集训｜涩谷短大生惨案' --fact-basis 'production/shibuya2006/FACT_CHECK.md；qa/cover-frame-provenance.json。取自本期S17生成源片，非历史影像，待最终成片复核。' --output '交付/第十七期_涩谷短大生惨案_封面.png'
      - name: Save cover and provenance to current branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f production/shibuya2006/qa/cover-source-S17.jpg production/shibuya2006/qa/cover-frame-provenance.json '交付/第十七期_涩谷短大生惨案_封面.png' '交付/第十七期_涩谷短大生惨案_封面.json'
          git commit -m 'shibuya2006: episode 17 cover from hash-verified current video frame'
          git pull --rebase origin arena/8d7fb4aa-desktop-tutorial
          git push origin arena/8d7fb4aa-desktop-tutorial
