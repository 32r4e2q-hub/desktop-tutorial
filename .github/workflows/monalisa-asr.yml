# 本片新增（2026-09-26）：出片前的配音 ASR 探针。
# 沙箱连不上任何 ASR 模型源，TTS 有没有吞字、分句起点对不对，只能在 runner 上转写配音来查。
# 触发：在分支上写/改 production/monalisa/ASR_REQUEST 并 push；
# 结果 production/monalisa/audio/asr-probe.json 由 runner commit 回分支（见 asr_probe.py 文件头）。
name: 蒙娜丽莎失窃案：一枚左手拇指印 · 配音ASR探针
run-name: 配音 ASR 探针 · 蒙娜丽莎失窃案：一枚左手拇指印 · ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0dbbf-desktop-tutorial
    paths:
      - production/monalisa/ASR_REQUEST

permissions:
  contents: write

concurrency:
  group: monalisa-asr-arena-01a0dbbf-desktop-tutorial
  cancel-in-progress: false

jobs:
  asr:
    if: github.ref == 'refs/heads/arena/01a0dbbf-desktop-tutorial'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 40
    env:
      HF_ENDPOINT: ${{ vars.HF_ENDPOINT || 'https://huggingface.co' }}
      HF_HUB_DISABLE_XET: ${{ vars.HF_HUB_DISABLE_XET || '1' }}
      WHISPER_CACHE_DIR: ${{ vars.WHISPER_CACHE_DIR }}
    steps:
      - name: 先让 git 走 HTTP/1.1（国内网络下 HTTP/2 会静默卡死）
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 30

      - name: Check out this Arena production branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a0dbbf-desktop-tutorial
          fetch-depth: 1

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -version | head -1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r production/requirements.txt
          python -m pip install "faster-whisper>=1.1,<2" "zhconv>=1.4" "pypinyin>=0.50" || \
          python -m pip install --break-system-packages "faster-whisper>=1.1,<2" "zhconv>=1.4" "pypinyin>=0.50"

      - name: Transcribe the six narration clips (no prompt) and compare
        env:
          ASR_MODELS: small,medium
        id: probe
        continue-on-error: true
        run: python3 -u production/monalisa/asr_probe.py --model "${ASR_MODELS:-small,medium}" --work work/monalisa/asr 2>&1 | tee /tmp/asr.log; exit ${PIPESTATUS[0]}

      - name: Commit asr-probe.json back to the branch
        run: |
          git config user.name "arena-asr"
          git config user.email "arena@local"
          if [ ! -f production/monalisa/audio/asr-probe.json ]; then
            tail -c 100000 /tmp/asr.log > production/monalisa/audio/asr-probe.log || true
          fi
          git add -f production/monalisa/audio/asr-probe.json production/monalisa/audio/asr-probe.log 2>/dev/null || \
          git add -f production/monalisa/audio/asr-probe.json 2>/dev/null || \
          git add -f production/monalisa/audio/asr-probe.log
          git commit -m "monalisa: 配音 ASR 探针报告 (faster-whisper small+medium, 无提示, 音节核对)" || true
          pushed=0
          for attempt in 1 2 3 4 5 6; do
            if git push origin "HEAD:${{ github.ref_name }}"; then pushed=1; break; fi
            git fetch origin ${{ github.ref_name }} && git rebase FETCH_HEAD || break
            sleep 10
          done
          [ "$pushed" = "1" ] || echo "::error::未能推送 ASR 探针报告"

      - name: Fail the run if the probe itself failed
        if: steps.probe.outcome != 'success'
        run: |
          echo "::error::ASR 探针没跑完，日志已 commit 到 production/monalisa/audio/asr-probe.log"
          exit 1
