name: 芦原区三母女案 · 本次视频下载准备
on:
  push:
    branches: [arena/ed1fa571-desktop-tutorial]
    paths: [production/nowon2021/VIDEO_DOWNLOAD_REQUEST]
permissions:
  contents: write
  actions: read
jobs:
  transfer:
    if: github.ref == 'refs/heads/arena/ed1fa571-desktop-tutorial'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/ed1fa571-desktop-tutorial
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          run-id: 42596892607
          github-token: ${{ github.token }}
          name: nowon2021-first-cut-4
          path: video
      - name: Transfer verified MP4 chunks without committing video files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 -u production/nowon2021/bridge_video.py 2>&1 | tee production/nowon2021/video-transfer-diagnostic.log
      - name: Save transfer manifest and diagnostic
        if: always()
        run: |
          set -euo pipefail
          git config user.name arena-autopilot
          git config user.email arena-autopilot@users.noreply.github.com
          if [ -f production/nowon2021/video-transfer-diagnostic.log ]; then git add -f production/nowon2021/video-transfer-diagnostic.log; fi
          if [ -f production/nowon2021/video-transfer-manifest.json ]; then git add -f production/nowon2021/video-transfer-manifest.json; fi
          git diff --cached --quiet || git commit -m 'Record temporary video transfer manifest [skip ci]'
          git push origin HEAD:arena/ed1fa571-desktop-tutorial
