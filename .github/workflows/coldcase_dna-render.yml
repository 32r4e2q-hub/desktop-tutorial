name: 冷案DNA · 出片
run-name: 出片 · 冷案DNA破案革命 · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      skip_asr:
        description: '跳过 ASR 对轨（离线时用停顿估算字幕时间）'
        type: boolean
        default: false
      film_name:
        description: '成片文件名'
        required: false
        default: '一根头发引发的破案革命_冷案复活与DNA表型分析_三分钟_带声音.mp4'
  push:
    branches:
      - arena/01a0a910-desktop-tutorial
    paths:
      - production/coldcase_dna/RENDER_REQUEST

permissions:
  contents: write

concurrency:
  group: coldcase_dna-render-arena-01a0a910-desktop-tutorial
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == 'refs/heads/arena/01a0a910-desktop-tutorial'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out this Arena production branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a0a910-desktop-tutorial
          fetch-depth: 1

      - name: Install media tools and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          ffmpeg -hide_banner -version | head -1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install render dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pillow>=10,<13" "numpy>=1.26,<3" "faster-whisper>=1.1,<2" "av>=12,<16" || \
          python -m pip install --break-system-packages "pillow>=10,<13" "numpy>=1.26,<3" "faster-whisper>=1.1,<2" "av>=12,<16"

      - name: Resolve the deliverable name
        env:
          FILM_INPUT: ${{ inputs.film_name }}
        run: |
          set -euo pipefail
          if [ -n "${FILM_INPUT:-}" ]; then
            film="$FILM_INPUT"
          else
            film='一根头发引发的破案革命_冷案复活与DNA表型分析_三分钟_带声音.mp4'
          fi
          echo "FILM_NAME=$film" >> "$GITHUB_ENV"
          echo "Deliverable: $film"

      - name: Validate, restore footage, render with measured audio, publish reports
        env:
          PROJECT: coldcase_dna
          SKIP_ASR: ${{ inputs.skip_asr || 'false' }}
          FILM_NAME: ${{ env.FILM_NAME }}
          BRANCH: arena/01a0a910-desktop-tutorial
        run: bash production/run_project.sh "$PROJECT" "$SKIP_ASR" "$FILM_NAME" 2>&1 | tee /tmp/rend.log production/coldcase_dna/last-render.log; exit ${PIPESTATUS[0]}

      - name: Ship failure log to branch (sandbox cannot read Actions logs)
        if: failure()
        run: |
          tail -c 200000 /tmp/rend.log > production/coldcase_dna/render-diag.log
          git config user.name "arena-diag"
          git config user.email "arena@local"
          git add -f production/coldcase_dna/render-diag.log
          git commit -m "render 失败诊断 $(date -u +%FT%TZ)"
          pushed=0
          for attempt in 1 2 3; do
            if git push origin "HEAD:${{ github.ref_name }}"; then pushed=1; break; fi
            git fetch origin ${{ github.ref_name }} && git rebase FETCH_HEAD || break
          done
          [ "$pushed" = "1" ] || echo "::error::诊断日志推不回分支，看本次运行的 artifact"

      - name: Upload the finished film
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coldcase_dna-成片-${{ github.run_number }}
          path: work/coldcase_dna/*.mp4
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
