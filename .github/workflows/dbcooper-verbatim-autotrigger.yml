name: DB库珀 · 逐字听检（push 触发）

on:
  push:
    branches:
      - arena/01a08e48-desktop-tutorial
    paths:
      - production/dbcooper/audio/**
      - 交付/DB库珀劫机案_三分钟_带声音.mp4
      - production/dbcooper/delivery/technical-report.json
  workflow_dispatch:
    inputs:
      film:
        description: '成片路径'
        required: false
        default: '交付/DB库珀劫机案_三分钟_带声音.mp4'
      model:
        description: 'whisper 模型'
        required: false
        default: 'small'
      max_cer:
        description: '字错率上限'
        required: false
        default: '0.15'

permissions:
  contents: write

concurrency:
  group: dbcooper-verbatim-arena-01a08e48-desktop-tutorial
  cancel-in-progress: false

jobs:
  listen:
    if: github.ref == 'refs/heads/arena/01a08e48-desktop-tutorial'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a08e48-desktop-tutorial
          fetch-depth: 1

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r production/requirements.txt
          python -m pip install "faster-whisper>=1.1,<2" "opencc-python-reimplemented>=0.1.7" || python -m pip install --break-system-packages "faster-whisper>=1.1,<2" "opencc-python-reimplemented>=0.1.7"

      - name: Transcribe and compare
        id: check
        continue-on-error: true
        env:
          PROJECT: dbcooper
          FILM: ${{ inputs.film || '交付/DB库珀劫机案_三分钟_带声音.mp4' }}
          MODEL: ${{ inputs.model || 'small' }}
          MAX_CER: ${{ inputs.max_cer || '0.15' }}
        run: |
          python3 -u production/verbatim_check.py \
            --film "$FILM" \
            --project "production/$PROJECT" \
            --work "work/$PROJECT/verbatim" \
            --narration "production/$PROJECT/audio" \
            --model "$MODEL" \
            --max-cer "$MAX_CER"
          cat work/$PROJECT/verbatim/verbatim-check.json

      - name: Publish report
        env:
          PROJECT: dbcooper
          BRANCH: arena/01a08e48-desktop-tutorial
        run: |
          mkdir -p "production/$PROJECT/delivery"
          cp "work/$PROJECT/verbatim/verbatim-check.json" "production/$PROJECT/delivery/" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "production/$PROJECT/delivery/verbatim-check.json"
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add verbatim check for dbcooper voice-01"
            git push origin "HEAD:$BRANCH"
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbcooper-逐字听检-${{ github.run_number }}
          path: work/dbcooper/verbatim
          if-no-files-found: warn
          retention-days: 30

      - name: Fail if high CER
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::字错率超过上限"
          exit 1
