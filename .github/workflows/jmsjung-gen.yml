# JMS 郑明析案：30 镜 × 6 秒 = 180 秒，全部走 Agnes 免费档 agnes-video-2.5-flash（720P）。
# 引擎 production/jmsjung/generate.py，模板来自仓库里的北九州项目（production/kitakyushu2002）。
#
# 为什么要上 Actions：沙箱连不上 apihub.agnes-ai.com，只有 runner 能连、也只有 runner 拿到
# AGNES_API_KEY。生成结果（results.json + qa 接触表）由 checkpoint 自动 commit 回本分支，
# 大视频只进 artifact，不进 Git。
name: JMS郑明析案 · Agnes 生成
run-name: JMS · Agnes 2.5-flash · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON: {"only":"S01"} / {"workers":2}；留空则按 GEN_REQUEST 全量 30 镜'
        type: string
        default: ''
  push:
    branches:
      - arena/929dc8b6-desktop-tutorial
    paths:
      - production/jmsjung/GEN_REQUEST

permissions:
  contents: write
  # 接力要用 GITHUB_TOKEN 显式 dispatch 下一轮：
  # **GITHUB_TOKEN 的 push 不会触发新的 workflow run**（GitHub 防自激回路的规则），
  # 2026-10-18 第 3 轮实测：auto_resume 推了 GEN_REQUEST（commit 943103f）却没起新 run，
  # 接力链静默断掉。dispatch 走的是 workflow API，不受这条规则限制。
  actions: write

concurrency:
  group: jmsjung-gen-arena-929dc8b6-desktop-tutorial
  # 断点续跑靠 results.json 里的 SHA-256 收据，取消不会丢已完成的镜头。
  # queued（不取消在跑的）：自 dispatch 的下一轮会排队等本轮收尾，
  # 不会在 artifact 上传途中把本轮掐掉。
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/arena/929dc8b6-desktop-tutorial'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 350
    steps:
      - name: Check out this Arena production branch
        uses: actions/checkout@v4
        with:
          ref: arena/929dc8b6-desktop-tutorial
          fetch-depth: 0

      - name: Resolve generation payload
        env:
          PAYLOAD_INPUT: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          if [ -n "${PAYLOAD_INPUT:-}" ]; then payload="$PAYLOAD_INPUT";
          elif [ -f production/jmsjung/GEN_REQUEST ]; then payload="$(tr -d '\n' < production/jmsjung/GEN_REQUEST)";
          else payload='{}'; fi
          echo "PAYLOAD=$payload" >> "$GITHUB_ENV"
          echo "Generation payload: $payload"

      - name: Install ffmpeg (clip inspection)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install inspection dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pillow>=10,<13" "numpy>=1.26,<3" "av>=12,<19"

      - name: Validate the 30 × 6-second timeline
        run: python3 production/jmsjung/generate.py --validate --clips-only

      - name: Generate 30 Agnes clips (queue-full retry every 180s)
        id: gen
        continue-on-error: true
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          PAYLOAD: ${{ env.PAYLOAD }}
        run: |
          set -o pipefail
          set +e
          python3 -u production/jmsjung/generate.py --publish --clips-only --payload "$PAYLOAD" 2>&1 | tee /tmp/gen.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 退出码 42 = 排队满（可接力） 43 = 额度耗尽  1 = 真 bug；由下面的接力步骤决定
          exit 0

      - name: Ship failure log to branch (sandbox cannot read Actions logs)
        if: steps.gen.outputs.rc != '0'
        run: |
          tail -c 200000 /tmp/gen.log > production/jmsjung/gen-diag.log || true
          git config user.name "arena-diag"
          git config user.email "arena@local"
          git add -f production/jmsjung/gen-diag.log
          git commit -m "jmsjung: 生成失败诊断 $(date -u +%FT%TZ)" || true
          git push origin HEAD:arena/929dc8b6-desktop-tutorial || true

      - name: Decide whether to resume (free queue is a lottery)
        id: resume
        if: always()
        run: |
          set -euo pipefail
          python3 production/jmsjung/auto_resume.py --rc "${{ steps.gen.outputs.rc }}"

      - name: Relay the next round (dispatch, because GITHUB_TOKEN pushes don't trigger runs)
        if: steps.resume.outputs.resume == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "arena-auto-resume"
          git config user.email "arena@local"
          # 1) GEN_REQUEST 照常回写：留档 + 下一轮 dispatch 的 payload 来源。
          git add production/jmsjung/GEN_REQUEST
          git commit -m "jmsjung: 排队满，自动接力下一轮 $(date -u +%FT%TZ)"
          for attempt in 1 2 3; do
            git push origin HEAD:arena/929dc8b6-desktop-tutorial && break || {
              sleep 5; git pull --rebase origin arena/929dc8b6-desktop-tutorial || true; }
          done
          # 2) 真正的接力：显式 workflow_dispatch 开下一轮。
          #    新 run 按 concurrency 排队，等本轮收尾后才起跑，不会掐掉本轮的 artifact。
          #    dispatch 失败就落一张收据 + 红掉本轮——宁可红着等人看，不许静默断链。
          payload=$(tr -d '\n' < production/jmsjung/GEN_REQUEST)
          echo "DISPATCH payload: $payload"
          set +e
          out=$(gh workflow run jmsjung-gen.yml --ref arena/929dc8b6-desktop-tutorial -f payload="$payload" 2>&1)
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            echo "DISPATCH_OK $out"
          else
            echo "$out" > production/jmsjung/dispatch-fail.txt
            echo "DISPATCH_FAILED: $out"
            git add production/jmsjung/dispatch-fail.txt
            git commit -m "jmsjung: 接力 dispatch 失败 $(date -u +%FT%TZ)" || true
            git push origin HEAD:arena/929dc8b6-desktop-tutorial || true
            exit 1
          fi

      - name: Fail the run when nothing will resume it
        if: steps.gen.outputs.rc != '0' && steps.resume.outputs.resume != 'true'
        run: |
          echo "生成未完成，且不会自动接力（rc=${{ steps.gen.outputs.rc }}）" >&2
          exit 1

      - name: Save generation evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jmsjung-agnes-${{ github.run_number }}
          path: |
            production/jmsjung/results.json
            production/jmsjung/qa/
            production/jmsjung/gen-diag.log
            work/jmsjung/clips/
          if-no-files-found: warn
          retention-days: 14
