# 模板：production/new_topic.py 会把 monalisa / arena/01a0dbbf-desktop-tutorial / 01a0dbbf-desktop-tutorial / 蒙娜丽莎失窃案：一枚左手拇指印 / 蒙娜丽莎失窃案_一枚左手拇指印_三分钟_带声音.mp4 换成新项目的值，
# 生成 production/<slug>/workflows/<slug>-*.yml；复制到 .github/workflows/ 后即可用 marker 文件 push 触发。
name: 蒙娜丽莎失窃案：一枚左手拇指印 · Agnes生成
run-name: 蒙娜丽莎失窃案：一枚左手拇指印 · Agnes Video V2.0 生成 · ${{ github.ref_name }}

# 触发方式：在分支上写 production/monalisa/GEN_REQUEST（内容就是 JSON payload）并 push。
#   全量：{"workers":2}        补做个别镜头：{"workers":1,"only":"S07,S12"}
# 沙箱连不上 Agnes API、也读不到 Actions 日志，所以素材与 results.json 由本工作流 commit 回分支。
# 中途失败可断点续跑：再改一下 GEN_REQUEST 重新 push，已完成的镜头按 SHA-256 复用、不重新生成。

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON: {"only":"S01","workers":1}；空则读 GEN_REQUEST'
        type: string
        default: '{"workers":2}'
  push:
    branches:
      - arena/01a0dbbf-desktop-tutorial
    paths:
      - production/monalisa/GEN_REQUEST

permissions:
  contents: write

# 并发组 r2（2026-09-26 07:08 UTC）：run 36221444679 在 06:01 S23/S24 排队后静默一个多小时、不再 checkpoint，
# 代理的 token 读不到本仓库 Actions REST、取消不了它，旧组里排队的 run 只能干等它 350 分钟超时。
# 换组让救援 run 立刻开跑：它一开跑就 commit results.json，旧 run 若醒来，下一次 checkpoint 必然 rebase 冲突而退出（不会写坏分支）；
# S23/S24 已存的 task_id 由救援 run 接着轮询，不重复生成。
concurrency:
  group: monalisa-agnes-r2-arena-01a0dbbf-desktop-tutorial
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/arena/01a0dbbf-desktop-tutorial'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 350
    steps:
      - name: Check out this Arena production branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a0dbbf-desktop-tutorial
          fetch-depth: 1

      - name: Resolve the generation payload
        env:
          PAYLOAD_INPUT: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          if [ -n "${PAYLOAD_INPUT:-}" ]; then
            payload="$PAYLOAD_INPUT"
          elif [ -f production/monalisa/GEN_REQUEST ]; then
            payload="$(tr -d '\n' < production/monalisa/GEN_REQUEST)"
          else
            payload='{"workers":2}'
          fi
          echo "PAYLOAD=$payload" >> "$GITHUB_ENV"
          echo "Generation payload: $payload"

      - name: Install media tools and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          ffmpeg -hide_banner -version | head -1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install render dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pillow>=10,<13" "numpy>=1.26,<3" "faster-whisper>=1.1,<2" "av>=12,<16" "opencv-python-headless>=4.8,<5" || \
          python -m pip install --break-system-packages "pillow>=10,<13" "numpy>=1.26,<3" "faster-whisper>=1.1,<2" "av>=12,<16" "opencv-python-headless>=4.8,<5"
          # opencv：clip_qa.py 逐帧畸变体检（光流残差 + Haar 正脸）；OpenCV 5 删了 Haar，所以钉 <5
          python -c "import cv2; assert not cv2.CascadeClassifier(cv2.data.haarcascades + 'haarcascade_frontalface_default.xml').empty(); print('opencv', cv2.__version__)"

      - name: Validate the complete three-minute timeline
        run: python3 production/monalisa/generate.py --validate

      - name: Drop dead provider tasks so a re-run submits fresh ones
        run: python3 production/monalisa/generate.py --prune-failed

      - name: Generate Agnes clips and checkpoint provenance
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          PAYLOAD: ${{ env.PAYLOAD }}
        run: python3 -u production/monalisa/generate.py --publish --payload "$PAYLOAD" 2>&1 | tee /tmp/gen.log; exit ${PIPESTATUS[0]}

      - name: Ship failure log to branch (sandbox cannot read Actions logs)
        if: failure()
        run: |
          tail -c 200000 /tmp/gen.log > production/monalisa/gen-diag.log
          git config user.name "arena-diag"
          git config user.email "arena@local"
          git add -f production/monalisa/gen-diag.log
          git commit -m "monalisa: Agnes 生成失败诊断 $(date -u +%FT%TZ)"
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${{ github.ref_name }}"; then pushed=1; break; fi
            git fetch origin ${{ github.ref_name }} && git rebase FETCH_HEAD || break
          done
          [ "$pushed" = "1" ] || echo "::error::诊断日志推不回分支，看本次运行的 artifact"

      - name: Save video clips as downloadable artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: monalisa-agnes-${{ github.run_number }}
          path: |
            work/monalisa/clips/
            production/monalisa/results.json
            production/monalisa/qa/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
