name: 井口真理子命案 · 成片渲染与技术质检
run-name: 井口真理子命案 · 1080p24 渲染

on:
  push:
    branches:
      - arena/36f9cd13-desktop-tutorial
    paths:
      - production/iguchi1990/RENDER_REQUEST
  workflow_dispatch:
    inputs:
      base_run_id:
        description: '30镜原始 Agnes run ID'
        type: string
        required: true
        default: '42363010740'
      base_artifact_name:
        description: '原始 Agnes artifact 名称'
        type: string
        required: true
        default: 'iguchi1990-agnes-2'
      repair_run_id:
        description: '仅含重生成镜头的 Agnes run ID'
        type: string
        required: true
      repair_artifact_name:
        description: '第一份重生成 Agnes artifact 名称，例如 iguchi1990-agnes-3'
        type: string
        required: true
      repair2_run_id:
        description: '可选的第二个重生成 run ID，用于分轮返工'
        type: string
        required: false
        default: ''
      repair2_artifact_name:
        description: '可选的第二份重生成 artifact 名称，例如 iguchi1990-agnes-4'
        type: string
        required: false
        default: ''
      publish:
        description: '技术门禁通过后将成片与字幕推回固定分支'
        type: boolean
        required: true
        default: true

permissions:
  actions: read
  contents: write

concurrency:
  group: iguchi1990-final-render-arena-36f9cd13-desktop-tutorial
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == 'refs/heads/arena/36f9cd13-desktop-tutorial'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - name: Check out the fixed Arena branch
        uses: actions/checkout@v4
        with:
          ref: arena/36f9cd13-desktop-tutorial
          fetch-depth: 1

      - name: Resolve artifact IDs from dispatch inputs or RENDER_REQUEST
        id: params
        env:
          BASE_RUN_INPUT: ${{ inputs.base_run_id }}
          BASE_ARTIFACT_INPUT: ${{ inputs.base_artifact_name }}
          REPAIR_RUN_INPUT: ${{ inputs.repair_run_id }}
          REPAIR_ARTIFACT_INPUT: ${{ inputs.repair_artifact_name }}
          REPAIR2_RUN_INPUT: ${{ inputs.repair2_run_id }}
          REPAIR2_ARTIFACT_INPUT: ${{ inputs.repair2_artifact_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          if os.environ.get('GITHUB_EVENT_NAME') == 'push':
              values = json.loads(Path('production/iguchi1990/RENDER_REQUEST').read_text(encoding='utf-8'))
          else:
              values = {
                  'base_run_id': os.environ.get('BASE_RUN_INPUT', ''),
                  'base_artifact_name': os.environ.get('BASE_ARTIFACT_INPUT', ''),
                  'repair_run_id': os.environ.get('REPAIR_RUN_INPUT', ''),
                  'repair_artifact_name': os.environ.get('REPAIR_ARTIFACT_INPUT', ''),
                  'repair2_run_id': os.environ.get('REPAIR2_RUN_INPUT', ''),
                  'repair2_artifact_name': os.environ.get('REPAIR2_ARTIFACT_INPUT', ''),
                  'publish': os.environ.get('PUBLISH_INPUT', 'true'),
              }
          for key in ('base_run_id', 'repair_run_id'):
              if not str(values.get(key, '')).isdigit():
                  raise SystemExit(f'{key} must be a numeric Actions run ID')
          for key in ('base_artifact_name', 'repair_artifact_name'):
              value = str(values.get(key, '')).strip()
              if not re.fullmatch(r'[A-Za-z0-9._-]+', value):
                  raise SystemExit(f'{key} must contain only letters, digits, dot, underscore or hyphen')
              values[key] = value
          repair2_id = str(values.get('repair2_run_id', '')).strip()
          repair2_name = str(values.get('repair2_artifact_name', '')).strip()
          if bool(repair2_id) != bool(repair2_name):
              raise SystemExit('repair2_run_id and repair2_artifact_name must be provided together')
          if repair2_id and not repair2_id.isdigit():
              raise SystemExit('repair2_run_id must be a numeric Actions run ID')
          if repair2_name and not re.fullmatch(r'[A-Za-z0-9._-]+', repair2_name):
              raise SystemExit('repair2_artifact_name contains invalid characters')
          values['repair2_run_id'] = repair2_id
          values['repair2_artifact_name'] = repair2_name
          publish = str(values.get('publish', True)).lower()
          if publish not in ('true', 'false'):
              raise SystemExit('publish must be true or false')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"base_run_id={values['base_run_id']}\n")
              output.write(f"base_artifact_name={values['base_artifact_name']}\n")
              output.write(f"repair_run_id={values['repair_run_id']}\n")
              output.write(f"repair_artifact_name={values['repair_artifact_name']}\n")
              output.write(f"repair2_run_id={values['repair2_run_id']}\n")
              output.write(f"repair2_artifact_name={values['repair2_artifact_name']}\n")
              output.write(f"publish={publish}\n")
          PY

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: production/requirements.txt

      - name: Download the completed 30-clip Agnes run on the runner
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.params.outputs.base_artifact_name }}
          path: work/iguchi1990/downloads/base
          run-id: ${{ steps.params.outputs.base_run_id }}
          github-token: ${{ github.token }}

      - name: Download the three reviewed replacement clips on the runner
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.params.outputs.repair_artifact_name }}
          path: work/iguchi1990/downloads/repair
          run-id: ${{ steps.params.outputs.repair_run_id }}
          github-token: ${{ github.token }}

      - name: Download the optional second replacement run
        if: ${{ steps.params.outputs.repair2_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.params.outputs.repair2_artifact_name }}
          path: work/iguchi1990/downloads/repair2
          run-id: ${{ steps.params.outputs.repair2_run_id }}
          github-token: ${{ github.token }}

      - name: Install rendering tools and CJK subtitles font
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install -r production/requirements.txt
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Merge verified source files without changing their bytes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil
          base = Path('work/iguchi1990/downloads/base')
          repair = Path('work/iguchi1990/downloads/repair')
          repair2 = Path('work/iguchi1990/downloads/repair2')
          destination = Path('work/iguchi1990/sources')
          destination.mkdir(parents=True, exist_ok=True)
          def copy_sources(root, replace=False):
              files = sorted(root.rglob('S[0-9][0-9].mp4'))
              if not files:
                  raise SystemExit(f'No Agnes MP4 sources found inside {root}')
              for source in files:
                  target = destination / source.name
                  if target.exists() and not replace:
                      raise SystemExit(f'Duplicate base source: {source.name}')
                  shutil.copyfile(source, target)
              print(f'{root}: copied {len(files)} MP4 files (replace={replace})')
          copy_sources(base)
          copy_sources(repair, replace=True)
          if repair2.exists():
              copy_sources(repair2, replace=True)
          actual = sorted(path.name for path in destination.glob('S[0-9][0-9].mp4'))
          expected = [f'S{i:02d}.mp4' for i in range(1, 31)]
          if actual != expected:
              raise SystemExit(f'Expected 30 ordered clips; got {actual}')
          print('Merged source count:', len(actual))
          PY

      - name: Validate the storyboard, narration, provenance, and media QC code
        run: |
          set -euo pipefail
          python production/iguchi1990/build_story.py
          python -m unittest production.tests.test_iguchi1990 production.tests.test_iguchi_render -v
          python production/iguchi1990/generate.py --validate

      - name: Render and run strict 180-second technical gates
        run: |
          set -euo pipefail
          python production/iguchi1990/render.py \
            --sources work/iguchi1990/sources \
            --work work/iguchi1990/render \
            --output "production/iguchi1990/交付/井口真理子命案_她没能回家_三分钟_1080p24.mp4" 2>&1 | tee work/iguchi1990/render.log
          test -s "production/iguchi1990/交付/井口真理子命案_她没能回家_三分钟_1080p24.mp4"
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('production/iguchi1990/qa/render_report.json').read_text(encoding='utf-8'))
          assert report['delivery']['width'] == 1920
          assert report['delivery']['height'] == 1080
          assert report['delivery']['frames'] == 4320
          assert report['music'] is False and report['melodic_bed'] is False
          assert report['voice_report']['silent_tail_seconds'] == 1.0
          print('Render gates passed; full-playback human review remains explicitly pending.')
          PY

      - name: Expose renderer diagnostics in the workflow summary on failure
        if: ${{ failure() }}
        run: |
          set +e
          if [ -s work/iguchi1990/render.log ]; then
            details="$(tail -n 30 work/iguchi1990/render.log | tr '\r\n' ' ')"
            details="${details//'%'/'%25'}"
            printf '::error title=Renderer diagnostics::%s\n' "$details"
            {
              printf '## Renderer diagnostics\n\n```text\n'
              tail -n 120 work/iguchi1990/render.log
              printf '\n```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit the rendered candidate and reproducibility reports
        if: ${{ steps.params.outputs.publish == 'true' }}
        run: |
          set -euo pipefail
          git config user.name "arena-autopilot"
          git config user.email "arena-autopilot@users.noreply.github.com"
          git add -f -- \
            production/iguchi1990/交付/井口真理子命案_她没能回家_三分钟_1080p24.mp4 \
            production/iguchi1990/交付/井口真理子命案_她没能回家_三分钟_1080p24.ass \
            production/iguchi1990/交付/井口真理子命案_她没能回家_三分钟_1080p24.srt \
            production/iguchi1990/qa/final_timeline.jpg \
            production/iguchi1990/qa/render_report.json \
            production/iguchi1990/qa/narration_timing.json \
            production/iguchi1990/audio/render_audio_report.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No new rendered files to publish."
          else
            git commit -m "iguchi1990: render and QC 1080p24 cut"
            for attempt in 1 2 3; do
              if git push origin "HEAD:arena/36f9cd13-desktop-tutorial"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              git pull --rebase origin arena/36f9cd13-desktop-tutorial
            done
          fi

      - name: Upload the final film and QC sidecars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iguchi1990-final-1080p24-${{ github.run_number }}
          path: |
            production/iguchi1990/交付/
            production/iguchi1990/qa/final_timeline.jpg
            production/iguchi1990/qa/render_report.json
            production/iguchi1990/qa/narration_timing.json
            production/iguchi1990/audio/render_audio_report.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
