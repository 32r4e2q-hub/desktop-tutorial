name: 蜜月尼古丁命案 · Agnes Video 2.5 Flash
run-name: 蜜月尼古丁命案 · 30镜片段生成

on:
  push:
    branches: [arena/31d27a2a-desktop-tutorial]
    paths:
      - production/honeymoon_nicotine/GEN_REQUEST
      - production/honeymoon_nicotine/CANCEL_REQUEST
      - .github/workflows/honeymoon-nicotine-gen.yml
  workflow_dispatch:
    inputs:
      payload:
        description: JSON payload, default generates all 30 clips
        type: string
        default: '{"mode":"clips","workers":2}'

permissions:
  contents: write
  actions: read

concurrency:
  group: honeymoon-nicotine-arena-31d27a2a-v3
  cancel-in-progress: true

jobs:
  generate:
    if: github.ref == 'refs/heads/arena/31d27a2a-desktop-tutorial'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout fixed Arena branch
        uses: actions/checkout@v4
        with:
          ref: arena/31d27a2a-desktop-tutorial
          fetch-depth: 1
      - name: Ensure media tools are available
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! ffmpeg -filters 2>/dev/null | grep -q subtitles; then
            sudo timeout 120s apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=20
            sudo timeout 120s apt-get install -y --no-install-recommends ffmpeg
          fi
          if ! fc-match 'Noto Sans CJK SC' 2>/dev/null | grep -q 'Noto Sans CJK SC'; then
            sudo timeout 120s apt-get install -y --no-install-recommends fonts-noto-cjk
          fi
          if ! python3 -c 'import numpy; from PIL import Image' >/dev/null 2>&1; then
            python3 -m pip install --break-system-packages --no-input --disable-pip-version-check pillow numpy
          fi
      - name: Validate plan and generate 30 Agnes clips
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          PAYLOAD_INPUT: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          payload="${PAYLOAD_INPUT:-}"
          if [ -z "$payload" ] && [ -f production/honeymoon_nicotine/GEN_REQUEST ]; then
            payload="$(cat production/honeymoon_nicotine/GEN_REQUEST)"
          fi
          if [ -z "$payload" ]; then payload='{"mode":"clips","workers":2}'; fi
          mode="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("mode", ""))' <<< "$payload")"
          if [ "$mode" = "render" ] || [ "$mode" = "qc" ]; then
            python3 production/honeymoon_nicotine/build_audio_manifest.py
          fi
          if [ "$mode" != "status" ] && [ "$mode" != "retrieve" ] && [ -f production/honeymoon_nicotine/CANCEL_REQUEST ]; then
            echo 'Cancellation requested; no Agnes generation requests will be made.'
            exit 0
          fi
          if [ "$mode" = "render" ] || [ "$mode" = "qc" ]; then
            python3 -u production/honeymoon_nicotine/generate.py --render-only --publish
            exit $?
          fi
          test -n "$AGNES_API_KEY"
          python3 production/honeymoon_nicotine/generate.py --validate --clips-only
          if [ "$mode" = "status" ]; then
            python3 -u production/honeymoon_nicotine/generate.py --check-outstanding --publish
            exit $?
          elif [ "$mode" = "retrieve" ]; then
            python3 -u production/honeymoon_nicotine/generate.py --retrieve-completed --payload "$payload" --publish
            exit $?
          fi
          python3 -u production/honeymoon_nicotine/generate.py --clips-only --payload "$payload" --publish
      - name: Upload generated footage and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: honeymoon-nicotine-agnes-${{ github.run_number }}
          path: |
            work/honeymoon_nicotine/
            交付/
            production/honeymoon_nicotine/results.json
            production/honeymoon_nicotine/qa/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
