name: 披萨炸弹 · 出片
run-name: 出片 · 披萨炸弹劫案

# 代理侧触发：改一下 production/pizzabomber/RENDER_REQUEST push 上来即可；
# paths 只看这一个文件，所以出片自己 commit 回分支的成片与报告不会自我循环。
# 流程本体在 production/run_project.sh（校验 → 按 SHA-256 回填素材 → 剪辑混音复测
# → 画质QC → 成片与报告 commit 回本分支），所有项目共用。

on:
  workflow_dispatch:
    inputs:
      skip_asr:
        description: '跳过 ASR 对轨（离线时用停顿估算字幕时间）'
        type: boolean
        default: false
      film_name:
        description: '成片文件名'
        required: false
        default: '披萨炸弹劫案_三分钟_带声音.mp4'
  push:
    branches:
      - arena/01a0a242-desktop-tutorial
    paths:
      - production/pizzabomber/RENDER_REQUEST

permissions:
  contents: write

concurrency:
  group: pizzabomber-render-arena-01a0a242-desktop-tutorial
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == 'refs/heads/arena/01a0a242-desktop-tutorial'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out this Arena production branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a0a242-desktop-tutorial
          fetch-depth: 1

      - name: Install media tools and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          ffmpeg -hide_banner -version | head -1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install render dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pillow>=10,<13" "numpy>=1.26,<3" "faster-whisper>=1.1,<2" "av>=12,<16" || \
          python -m pip install --break-system-packages "pillow>=10,<13" "numpy>=1.26,<3" "faster-whisper>=1.1,<2" "av>=12,<16"

      - name: Resolve the deliverable name
        env:
          FILM_INPUT: ${{ inputs.film_name }}
        run: |
          set -euo pipefail
          if [ -n "${FILM_INPUT:-}" ]; then
            film="$FILM_INPUT"
          else
            film='披萨炸弹劫案_三分钟_带声音.mp4'
          fi
          echo "FILM_NAME=$film" >> "$GITHUB_ENV"
          echo "Deliverable: $film"

      - name: Validate, restore footage, render with measured audio, publish reports
        env:
          PROJECT: pizzabomber
          SKIP_ASR: ${{ inputs.skip_asr || 'false' }}
          FILM_NAME: ${{ env.FILM_NAME }}
          BRANCH: arena/01a0a242-desktop-tutorial
        run: bash production/run_project.sh "$PROJECT" "$SKIP_ASR" "$FILM_NAME"

      - name: Upload the finished film
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pizzabomber-成片-${{ github.run_number }}
          path: work/pizzabomber/*.mp4
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
