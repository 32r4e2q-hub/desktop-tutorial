name: 披萨炸弹 · 出片
run-name: 出片 · 披萨炸弹劫案

# 代理侧触发：改一下 production/pizzabomber/RENDER_REQUEST push 上来即可；
# paths 只看这一个文件，所以出片自己 commit 回分支的成片与报告不会自我循环。
# 流程本体在 production/run_project.sh（校验 → 按 SHA-256 回填素材 → 剪辑混音复测
# → 画质QC → 成片与报告 commit 回本分支），所有项目共用。

on:
  workflow_dispatch:
    inputs:
      skip_asr:
        description: '跳过 ASR 对轨（离线时用停顿估算字幕时间）'
        type: boolean
        default: false
      film_name:
        description: '成片文件名'
        required: false
        default: '披萨炸弹劫案_三分钟_带声音.mp4'
  push:
    branches:
      - arena/01a0a242-desktop-tutorial
    paths:
      - production/pizzabomber/RENDER_REQUEST

permissions:
  contents: write

concurrency:
  group: pizzabomber-render-arena-01a0a242-desktop-tutorial
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == 'refs/heads/arena/01a0a242-desktop-tutorial'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out this Arena production branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a0a242-desktop-tutorial
          fetch-depth: 1

      - name: Install media tools and CJK fonts
        run: bash production/run_project.sh "$PROJECT" "$SKIP_ASR" "$FILM_NAME" 2>&1 | tee /tmp/rend.log; exit ${PIPESTATUS[0]}

      - name: Ship failure tail to branch (sandbox cannot read Actions logs)
        if: failure()
        run: |
          tail -c 60000 /tmp/rend.log > production/pizzabomber/render-diag.log
          git config user.name "arena-diag"
          git config user.email "arena@local"
          git add -f production/pizzabomber/render-diag.log
          git commit -m "render 失败诊断 $(date -u +%FT%TZ)"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload the finished film
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pizzabomber-成片-${{ github.run_number }}
          path: work/pizzabomber/*.mp4
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
