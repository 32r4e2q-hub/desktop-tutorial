name: 呼格吉勒图案 · 内容审核探测
on:
  push:
    branches: [arena/ba89b9ff-desktop-tutorial]
    paths: [production/hugejiletu/PROBE_REQUEST]
permissions:
  contents: write
jobs:
  probe:
    if: github.ref == 'refs/heads/arena/ba89b9ff-desktop-tutorial'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/ba89b9ff-desktop-tutorial
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "zhipuai>=2.1" requests sniffio httpx
      - name: Probe moderation
        env:
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
        run: |
          python3 -u production/hugejiletu/probe_moderation.py > production/hugejiletu/probe-report.md 2>&1 || true
          cat production/hugejiletu/probe-report.md
      - name: Commit report
        if: always()
        run: |
          git config user.name arena-diag
          git config user.email arena@local
          git add -f production/hugejiletu/probe-report.md
          git commit -m "hugejiletu: moderation probe report" || true
          git push origin HEAD:arena/ba89b9ff-desktop-tutorial || true
