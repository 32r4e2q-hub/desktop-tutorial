name: AI 视频生成 (CogVideoX-Flash)

on:
  push:
    paths:
      - 'trigger_video.txt'
      - 'production/gacy/REQUEST'
  workflow_dispatch:
    inputs:
      prompt:
        description: '普通测试提示词；盖西制作使用 __GACY__:references / identity / recover / probe / video / audio / render / all'
        required: true
        default: '阳光明媚的森林，一只小松鼠在树枝上吃坚果，高清真实，电影质感'

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: cogvideo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 350
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 选择生产模式
        id: mode
        env:
          INPUT_PROMPT: ${{ inputs.prompt }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          mode=test
          stage=references
          if [[ "$INPUT_PROMPT" == __GACY__:* ]]; then
            mode=gacy
            stage="${INPUT_PROMPT#__GACY__:}"
          elif [[ "$EVENT" == push ]] && [[ -f production/gacy/REQUEST ]] && [[ "$GITHUB_REF_NAME" == arena/3c0c229a-desktop-tutorial ]]; then
            mode=gacy
            stage="$(head -n 1 production/gacy/REQUEST)"
          fi
          if [[ "$mode" == gacy ]]; then
            test "$GITHUB_REF_NAME" = arena/3c0c229a-desktop-tutorial
            case "$stage" in references|identity|recover|probe|video|audio|render|all) ;; *) exit 2;; esac
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: python -m pip install zhipuai sniffio httpx requests numpy pillow edge-tts pytest

      - name: 安装合成工具与中文字体
        if: steps.mode.outputs.mode == 'gacy'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk

      - name: 恢复制作缓存
        if: steps.mode.outputs.mode == 'gacy'
        uses: actions/cache/restore@v4
        with:
          path: work/gacy
          key: gacy-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: gacy-v1-

      - name: 校验29镜头与生产代码
        if: steps.mode.outputs.mode == 'gacy'
        run: |
          python production/gacy/validate.py
          python -m pytest production/gacy -q

      - name: 执行制作并记录退出码（仅智谱免费模型）
        id: production
        if: steps.mode.outputs.mode == 'gacy'
        env:
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
          STAGE: ${{ steps.mode.outputs.stage }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -u production/gacy/pipeline.py --stage "$STAGE" 2>&1 | tee run_output.log
          result=${PIPESTATUS[0]}
          set -e
          if [[ "$result" == 0 && "$STAGE" == probe ]]; then
            git config user.name 'Arena production runner'
            git config user.email 'arena@local'
            for path in production/gacy/receipts.json production/gacy/api-diagnostics.json production/gacy/run-status.json production/gacy/qa; do
              if [ -e "$path" ]; then git add "$path"; fi
            done
            if ! git diff --cached --quiet; then
              git commit -m 'gacy: first animated clip recovered; continue remaining production'
              git push origin arena/3c0c229a-desktop-tutorial
            fi
            set +e
            python -u production/gacy/pipeline.py --stage all 2>&1 | tee -a run_output.log
            result=${PIPESTATUS[0]}
            set -e
          fi
          echo "code=$result" >> "$GITHUB_OUTPUT"
          echo "Production exit code: $result (42 means waiting, not completed)"

      - name: 普通单镜连通性测试
        if: steps.mode.outputs.mode == 'test'
        env:
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
          INPUT_PROMPT: ${{ inputs.prompt }}
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/run_cogvideox.py 2>&1 | tee run_output.log

      - name: 保存缓存（包含失败时已生成的动态镜头）
        if: always() && steps.mode.outputs.mode == 'gacy'
        uses: actions/cache/save@v4
        with:
          path: work/gacy
          key: gacy-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 决定是否接力续查（永久错误绝不接力）
        id: relay
        if: always() && steps.mode.outputs.mode == 'gacy'
        env:
          STAGE: ${{ steps.mode.outputs.stage }}
          EXIT_CODE: ${{ steps.production.outputs.code || '1' }}
        run: python production/gacy/relay.py --stage "$STAGE" --code "$EXIT_CODE"

      - name: 回存参考图与任务收据（不含密钥与原始请求）
        if: always() && steps.mode.outputs.mode == 'gacy'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = arena/3c0c229a-desktop-tutorial
          git config user.name 'Arena production runner'
          git config user.email 'arena@local'
          for path in production/gacy/references production/gacy/keyframes production/gacy/qa production/gacy/receipts.json production/gacy/run-status.json production/gacy/api-diagnostics.json production/gacy/identity-probe production/gacy/identity-gate-report.json production/gacy/recovery-report.json production/gacy/relay-state.json; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          if [ -d work/gacy/delivery ]; then
            mkdir -p production/gacy/delivery
            cp work/gacy/delivery/*.json production/gacy/delivery/ 2>/dev/null || true
            cp work/gacy/delivery/*.ass production/gacy/delivery/ 2>/dev/null || true
            git add production/gacy/delivery
          fi
          if [ -f work/gacy/delivery/technical-report.json ]; then
            mkdir -p 交付
            for media in work/gacy/delivery/*.mp4 work/gacy/delivery/*.jpg; do
              if [ -f "$media" ] && [ "$(stat -c %s "$media")" -lt 85000000 ]; then
                cp "$media" 交付/
                git add "交付/$(basename "$media")"
              fi
            done
          fi
          for clip in 交付/盖西_同脸实验_*_原始片段.mp4; do
            if [ -f "$clip" ]; then git add "$clip"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "gacy: checkpoint generated references, receipts and review status"
            git push origin arena/3c0c229a-desktop-tutorial
          fi

      - name: 上传素材、音轨、待审片与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-output-${{ github.run_id }}
          path: |
            run_output.log
            output_video.mp4
            production/gacy/references/
            production/gacy/keyframes/
            production/gacy/qa/
            production/gacy/receipts.json
            production/gacy/run-status.json
            production/gacy/api-diagnostics.json
            production/gacy/identity-probe/
            production/gacy/identity-gate-report.json
            work/gacy/identity-probe/
            work/gacy/recovered/
            production/gacy/recovery-report.json
            production/gacy/relay-state.json
            work/gacy/delivery/
          if-no-files-found: warn
          retention-days: 14

      - name: 官方dispatch接力（GitHub Token推送本身不会触发下一轮）
        id: dispatch
        if: steps.relay.outputs.resume == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ steps.mode.outputs.stage }}
        run: |
          gh workflow run generate_video.yml --ref arena/3c0c229a-desktop-tutorial -f "prompt=__GACY__:$STAGE"
          echo '已请求下一轮；当前仍是等待状态，不是成片完成。' >> "$GITHUB_STEP_SUMMARY"

      - name: 汇总真实结果（续查不冒充视频完成）
        if: always() && steps.mode.outputs.mode == 'gacy'
        env:
          EXIT_CODE: ${{ steps.production.outputs.code || '1' }}
          RELAY: ${{ steps.relay.outputs.resume }}
          DISPATCH: ${{ steps.dispatch.outcome }}
        run: |
          if [ "$EXIT_CODE" = 0 ]; then
            echo '本阶段结束；素材/同脸/成片状态须查看run-status.json，不能只看绿色。' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$EXIT_CODE" = 42 ] && [ "$RELAY" = true ] && [ "$DISPATCH" = success ]; then
            echo '尚未完成：现有任务/容量状态已保存，已请求有界接力。' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo '本阶段停止：真实错误或接力预算耗尽，请查看收据。' >> "$GITHUB_STEP_SUMMARY"
          exit "$EXIT_CODE"
