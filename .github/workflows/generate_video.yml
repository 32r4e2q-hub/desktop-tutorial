name: AI 视频生成 (CogVideoX-Flash)

on:
  push:
    paths:
      - 'trigger_video.txt'
  workflow_dispatch:
    inputs:
      prompt:
        description: '请输入生成视频的提示词 (Prompt)'
        required: true
        default: '阳光明媚的森林，一只小松鼠在树枝上吃坚果，高清真实，电影质感'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖
        run: |
          pip install zhipuai requests

      - name: 调用 CogVideoX-Flash 生成视频
        id: run_step
        env:
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
          INPUT_PROMPT: ${{ github.event.inputs.prompt }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import time
          import requests
          import traceback
          from zhipuai import ZhipuAI

          log_lines = []
          def log(msg):
              print(msg)
              log_lines.append(str(msg))

          def save_log():
              with open("run_output.log", "w", encoding="utf-8") as f:
                  f.write("\n".join(log_lines))

          api_key = os.getenv("ZHIPUAI_API_KEY")
          prompt = os.getenv("INPUT_PROMPT")

          if not prompt:
              if os.path.exists("trigger_video.txt"):
                  with open("trigger_video.txt", "r", encoding="utf-8") as f:
                      prompt = f.read().strip()
          
          if not prompt:
              prompt = "一只可爱的小猫咪在阳光下的花园里捉蝴蝶，草地，电影质感，超高清"

          if not api_key:
              log("❌ 错误: 未检测到 ZHIPUAI_API_KEY (secrets.ZHIPUAI_API_KEY 为空或未配置成功)！")
              save_log()
              sys.exit(1)
          else:
              masked = api_key[:4] + "..." + api_key[-4:] if len(api_key) > 8 else "***"
              log(f"🔑 检测到 API_KEY: {masked}")

          try:
              client = ZhipuAI(api_key=api_key)
              log(f"🎬 正在提交智谱 CogVideoX-Flash 任务...")
              log(f"📝 提示词: {prompt}")

              response = client.videos.generations(
                  model="cogvideox-flash",
                  prompt=prompt,
                  quality="speed"
              )
              task_id = response.id
              log(f"✅ 任务提交成功！Task ID: {task_id}")
          except Exception as e:
              log(f"❌ 任务提交异常: {e}")
              log(traceback.format_exc())
              save_log()
              sys.exit(1)

          log("⏳ 正在等待云端渲染完成（约需 50~70 秒）...")
          start_time = time.time()
          while True:
              try:
                  result = client.videos.retrieve_videos_result(id=task_id)
                  status = result.task_status
                  elapsed = int(time.time() - start_time)

                  if status == "SUCCESS":
                      video_url = result.video_result[0].url
                      log(f"\n🎉 视频生成成功！耗时: {elapsed} 秒")
                      log(f"🔗 官方下载链接 (30天有效):\n{video_url}\n")
                      
                      # 下载视频保存为 artifact
                      log("⬇️ 正在下载视频文件...")
                      res = requests.get(video_url, timeout=60)
                      with open("output_video.mp4", "wb") as f:
                          f.write(res.content)
                      log("💾 已保存为 output_video.mp4")
                      save_log()
                      break
                  elif status == "FAIL":
                      log(f"\n❌ 生成失败: {result}")
                      save_log()
                      sys.exit(1)
                  else:
                      log(f"[{elapsed}s] 状态: {status} (排队或生成中)...")
                      time.sleep(10)
              except Exception as err:
                  log(f"⚠️ 查询状态出现重试警告: {err}")
                  time.sleep(10)
          EOF

      - name: 报告日志到 Summary 和 Annotation
        if: always()
        run: |
          if [ -f run_output.log ]; then
            cat run_output.log >> $GITHUB_STEP_SUMMARY
            CLEAN_LOG=$(cat run_output.log | tr '\n' ' ' | head -c 500)
            echo "::notice title=视频生成运行报告::$CLEAN_LOG"
          fi

      - name: 上传视频文件至 Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cogvideox-flash-result
          path: |
            output_video.mp4
            run_output.log
          if-no-files-found: warn
          retention-days: 7
