name: AI 视频生成 (CogVideoX-Flash)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: '请输入生成视频的提示词 (Prompt)'
        required: true
        default: '阳光明媚的森林，一只小松鼠在树枝上吃坚果，高清真实，电影质感'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前分支
        uses: actions/checkout@v4

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖
        run: |
          pip install zhipuai requests

      - name: 调用 CogVideoX-Flash 生成视频
        env:
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
          PROMPT: ${{ github.event.inputs.prompt }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import time
          import requests
          from zhipuai import ZhipuAI

          api_key = os.getenv("ZHIPUAI_API_KEY")
          prompt = os.getenv("PROMPT")

          if not api_key:
              print("❌ 错误: 未检测到 ZHIPUAI_API_KEY，请检查 GitHub Secret 配置！")
              sys.exit(1)

          client = ZhipuAI(api_key=api_key)

          print(f"🎬 正在提交智谱 CogVideoX-Flash 任务...")
          print(f"📝 提示词: {prompt}")

          try:
              response = client.videos.generations(
                  model="cogvideox-flash",
                  prompt=prompt,
                  quality="speed"
              )
              task_id = response.id
              print(f"✅ 任务提交成功！Task ID: {task_id}")
          except Exception as e:
              print(f"❌ 任务提交异常: {e}")
              sys.exit(1)

          print("⏳ 正在等待云端渲染完成（约需 50~70 秒）...")
          start_time = time.time()
          while True:
              try:
                  result = client.videos.retrieve_videos_result(id=task_id)
                  status = result.task_status
                  elapsed = int(time.time() - start_time)

                  if status == "SUCCESS":
                      video_url = result.video_result[0].url
                      print(f"\n🎉 视频生成成功！耗时: {elapsed} 秒")
                      print(f"🔗 官方下载链接 (30天有效):\n{video_url}\n")
                      
                      # 下载视频保存为 artifact
                      print("⬇️ 正在下载视频文件...")
                      res = requests.get(video_url, timeout=60)
                      with open("output_video.mp4", "wb") as f:
                          f.write(res.content)
                      print("💾 已保存为 output_video.mp4")
                      break
                  elif status == "FAIL":
                      print(f"\n❌ 生成失败: {result}")
                      sys.exit(1)
                  else:
                      print(f"[{elapsed}s] 状态: {status} (排队或生成中)...")
                      time.sleep(10)
              except Exception as err:
                  print(f"⚠️ 查询状态出现重试警告: {err}")
                  time.sleep(10)
          EOF

      - name: 上传视频文件至 Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cogvideox-flash-result
          path: output_video.mp4
          if-no-files-found: warn
          retention-days: 7
