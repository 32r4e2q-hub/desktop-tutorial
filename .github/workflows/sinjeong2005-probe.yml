name: 新亭洞连环杀人案 · 智谱任务探活

# 触发：push production/sinjeong2005/PROBE_REQUEST。只读查询在队任务状态，
# 结果写 production/sinjeong2005/probe-report.json 并 commit 回分支。不改 results.json。

on:
  push:
    branches:
      - arena/f3e80641-desktop-tutorial
    paths:
      - production/sinjeong2005/PROBE_REQUEST

permissions:
  contents: write

concurrency:
  group: sinjeong2005-probe-arena-f3e80641-desktop-tutorial
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/arena/f3e80641-desktop-tutorial'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - name: Check out this Arena production branch
        uses: actions/checkout@v4
        with:
          ref: arena/f3e80641-desktop-tutorial
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Zhipu SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install "zhipuai" "sniffio" "httpx" "requests"

      - name: Probe outstanding Zhipu tasks
        env:
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
        run: python3 -u production/sinjeong2005/probe_tasks.py

      - name: Commit probe report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/sinjeong2005/probe-report.json
          git commit -m "sinjeong2005: 智谱任务探活报告" || exit 0
          for attempt in 1 2 3; do
            if git push origin arena/f3e80641-desktop-tutorial; then break; fi
            git pull --rebase origin arena/f3e80641-desktop-tutorial
          done
