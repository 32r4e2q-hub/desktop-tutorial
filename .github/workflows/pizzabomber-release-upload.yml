name: 披萨炸弹 · Release 资产上传
run-name: 上传终版成片到 Release

# 一次性辅助管道：沙箱出口连不上 uploads.github.com，
# 由 runner 从本分支取成片，传到 release pizzabomber-final-2026-09-15。
# 手动触发（workflow_dispatch）。用完可删。

on:
  workflow_dispatch:
  # 仓库惯例的代理触发：push 一个空标记文件即可跑（本工作流只在 arena 分支上，
  # main 上不可被发现，workflow_dispatch 会 404）。
  push:
    branches:
      - arena/01a0a39f-desktop-tutorial
    paths:
      - production/pizzabomber/RELEASE_UPLOAD_REQUEST

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0a39f-desktop-tutorial
          fetch-depth: 1
      - name: 上传资产到 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --name 指定 ASCII 资产名（runner 上中文文件名会被 locale 损坏成 ._）
          gh release upload pizzabomber-final-2026-09-15 \
            "交付/披萨炸弹劫案_三分钟_带声音.mp4" \
            --clobber --name pizzabomber-3min-final-1080p.mp4
          gh api repos/32r4e2q-hub/desktop-tutorial/releases/tags/pizzabomber-final-2026-09-15 \
            --jq '.assets[] | {id,name,size,download_url}'
