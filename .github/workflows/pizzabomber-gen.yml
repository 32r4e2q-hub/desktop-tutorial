name: 披萨炸弹 · Agnes生成
run-name: 披萨炸弹 · Agnes Video V2.0 生成

# 用法一（人在 Actions 里点）：选「披萨炸弹 · Agnes生成」，填 payload
#   （默认 workers=2，75 秒节流，23 个镜头约 30~60 分钟）。
# 用法二（代理触发）：把 {"only":"S05,S10","workers":1} 之类的 payload 写进
#   production/pizzabomber/GEN_REQUEST 再 push——paths 只看这一个文件，生成器的
#   逐镜 checkpoint 不会把这条流水线自己点第二遍。
# 断点续跑：已完成镜头按 request_hash + SHA-256 复用、不重烧额度；被 provider
#   判死的任务先由 --prune-failed 清掉（DB库珀 2026-09-13 的 S10 教训）。

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON: {"only":"S01","workers":1}；空则读 GEN_REQUEST'
        type: string
        default: '{"workers":2}'
  push:
    branches:
      - arena/01a0a39f-desktop-tutorial
    paths:
      - production/pizzabomber/GEN_REQUEST

permissions:
  contents: write

concurrency:
  group: pizzabomber-agnes-arena-01a0a39f-desktop-tutorial
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/arena/01a0a39f-desktop-tutorial'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out this Arena production branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a0a39f-desktop-tutorial
          fetch-depth: 1

      - name: Resolve the generation payload
        env:
          PAYLOAD_INPUT: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          if [ -n "${PAYLOAD_INPUT:-}" ]; then
            payload="$PAYLOAD_INPUT"
          elif [ -f production/pizzabomber/GEN_REQUEST ]; then
            payload="$(tr -d '\n' < production/pizzabomber/GEN_REQUEST)"
          else
            payload='{"workers":2}'
          fi
          echo "PAYLOAD=$payload" >> "$GITHUB_ENV"
          echo "Generation payload: $payload"

      - name: Install media tools and CJK fonts (first-cut render needs both)
        # 2026-09-15：没有这一步，--publish 尾部自带的初版渲染必挂在
        # render.find_font()（runner 默认没有 Noto CJK）——上一会话的
        # pipeline_failed 就是这个原因，素材本身不受影响。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          ffmpeg -hide_banner -version | head -1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install render dependencies (first-cut render uses PIL/numpy/PyAV/ASR)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pillow>=10,<13" "numpy>=1.26,<3" "faster-whisper>=1.1,<2" "av>=12,<16" || \
          python -m pip install --break-system-packages "pillow>=10,<13" "numpy>=1.26,<3" "faster-whisper>=1.1,<2" "av>=12,<16"

      - name: Validate the complete three-minute timeline
        run: python3 production/pizzabomber/generate.py --validate

      - name: Drop dead provider tasks so a re-run submits fresh ones
        run: python3 production/pizzabomber/generate.py --prune-failed

      - name: Generate Agnes clips and checkpoint provenance
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          PAYLOAD: ${{ env.PAYLOAD }}
        run: python3 -u production/pizzabomber/generate.py --publish --payload "$PAYLOAD"

      - name: Save video clips as downloadable artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pizzabomber-agnes-${{ github.run_number }}
          path: |
            work/pizzabomber/clips/
            production/pizzabomber/results.json
            production/pizzabomber/qa/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
