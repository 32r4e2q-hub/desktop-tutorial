name: Shipman · 出片
run-name: 希普曼 · 出片 · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      skip_asr:
        description: '跳过 ASR 对轨'
        type: boolean
        default: false
      film_name:
        description: '成片文件名（留空用标题）'
        required: false
        default: ''
  push:
    branches:
      - arena/01a0c697-desktop-tutorial
    paths:
      - production/shipman/RENDER_REQUEST

permissions:
  contents: write

concurrency:
  group: shipman-render-arena-01a0c697-desktop-tutorial
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == 'refs/heads/arena/01a0c697-desktop-tutorial'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out this Arena production branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a0c697-desktop-tutorial
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !*.mp4
          sparse-checkout-cone-mode: false

      - name: Install media tools and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          ffmpeg -hide_banner -version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install render dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pillow>=10,<13" "numpy>=1.26,<3" "faster-whisper>=1.1,<2" "av>=12,<16" || \
          python -m pip install --break-system-packages "pillow>=10,<13" "numpy>=1.26,<3" "faster-whisper>=1.1,<2" "av>=12,<16"

      - name: Validate, restore footage, render with measured audio, publish reports
        env:
          PROJECT: shipman
          SKIP_ASR: ${{ inputs.skip_asr }}
          FILM_NAME: ${{ inputs.film_name }}
          BRANCH: arena/01a0c697-desktop-tutorial
        run: bash production/run_project.sh "$PROJECT" "$SKIP_ASR" "$FILM_NAME"

      - name: Upload the finished film
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipman-film-${{ github.run_number }}
          path: |
            work/shipman/*.mp4
            production/shipman/delivery/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
