name: 离线自检

# 每次 push / PR 都跑一遍离线测试：流水线闸门、工作流形状、配音哈希。
# 这里只做离线检查（不需要 ffmpeg、不消耗生成额度），所以可以每次提交都跑。

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # 自托管 runner 上，仓库里那个 48 MB 的成片会让每次 clone 又慢又容易断
          # （实测：55 MB 的浅克隆在 227 KB/s 的线路上跑了 10 分钟还没完，
          # 而同一台机器下 215 MB 的 runner 安装包直接卡死在 0 字节）。
          # 离线自检不需要任何 mp4（测试只读 production/**，没有任何用例打开成片），
          # 所以用 partial clone + sparse-checkout 跳过 *.mp4：55 MB → 约 7 MB。
          # 去掉 --no-cone 那个坑也踩过：cone 模式不认通配符，必须显式关掉。
          filter: blob:none
          sparse-checkout: |
            /*
            !*.mp4
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r production/requirements.txt

      - name: Install ffmpeg (the four level-measuring tests need it)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -version | head -1

      - name: Run the offline gate
        run: python -m pytest production/tests -q
