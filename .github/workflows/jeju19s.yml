name: 济州敞篷车案 · 续作复核与出片
run-name: 济州敞篷车案 · 30镜视频制作

on:
  push:
    branches: [arena/5375d891-desktop-tutorial]
    paths:
      - production/jeju19s/GEN_REQUEST
      - production/jeju19s/CANCEL_REQUEST
      - .github/workflows/jeju19s.yml
  workflow_dispatch:
    inputs:
      payload:
        description: JSON payload, e.g. {"mode":"clips","workers":2}
        type: string
        default: '{"mode":"clips","workers":2}'

permissions:
  contents: write
  actions: read

concurrency:
  group: jeju19s-agnes-arena-5375d891
  cancel-in-progress: false

jobs:
  produce:
    if: github.ref == 'refs/heads/arena/5375d891-desktop-tutorial'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 300
    steps:
      - name: Checkout the current Arena branch
        uses: actions/checkout@v4
        with:
          ref: arena/5375d891-desktop-tutorial
          fetch-depth: 1

      - name: Install media tools and subtitle font
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/media-tools" --no-save --ignore-scripts --no-audit --no-fund \
            @ffmpeg-installer/linux-x64@4.1.0 @ffprobe-installer/linux-x64@5.2.0
          mkdir -p "$RUNNER_TEMP/media-tools/bin" "$HOME/.local/share/fonts"
          chmod +x "$RUNNER_TEMP/media-tools/node_modules/@ffmpeg-installer/linux-x64/ffmpeg" \
            "$RUNNER_TEMP/media-tools/node_modules/@ffprobe-installer/linux-x64/ffprobe"
          ln -sf "$RUNNER_TEMP/media-tools/node_modules/@ffmpeg-installer/linux-x64/ffmpeg" "$RUNNER_TEMP/media-tools/bin/ffmpeg"
          ln -sf "$RUNNER_TEMP/media-tools/node_modules/@ffprobe-installer/linux-x64/ffprobe" "$RUNNER_TEMP/media-tools/bin/ffprobe"
          echo "$RUNNER_TEMP/media-tools/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/media-tools/bin:$PATH"
          GH_TOKEN="${{ github.token }}" gh api -H 'Accept: application/vnd.github.raw' \
            'repos/notofonts/noto-cjk/contents/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf?ref=f8d157532fbfaeda587e826d4cd5b21a49186f7c' \
            > "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
          if command -v fc-cache >/dev/null; then fc-cache -f "$HOME/.local/share/fonts"; fi
          ffmpeg -hide_banner -filters 2>&1 | grep -q subtitles
          ffprobe -version | head -1
          python3 -m pip install --break-system-packages --no-input --disable-pip-version-check numpy pillow av

      - name: Restore approved reference PNGs into the working tree only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          here = Path('production/jeju19s')
          approvals = json.loads((here / 'reference/approvals.json').read_text())
          default_revision = (here / 'reference/revision.txt').read_text().strip()
          fetched = set()
          for aid, row in approvals['assets'].items():
              if row.get('status') != 'approved':
                  raise SystemExit(f'{aid}: reference is not approved')
              revision = str(row.get('revision') or default_revision)
              if revision not in fetched:
                  subprocess.run(['git', 'fetch', '--depth=1', 'origin', revision], check=True)
                  fetched.add(revision)
              rel = row['file']
              dest = here / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              data = subprocess.check_output(['git', 'show', f'{revision}:production/jeju19s/{rel}'])
              if hashlib.sha256(data).hexdigest() != row['sha256']:
                  raise SystemExit(f'{aid}: pinned reference checksum mismatch')
              dest.write_bytes(data)
              print(f'restored {aid} from {revision[:12]} ({len(data)} bytes)')
          PY

      - name: Validate and run the requested mode
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          PAYLOAD_INPUT: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          payload="${PAYLOAD_INPUT:-}"
          if [ -z "$payload" ] && [ -f production/jeju19s/GEN_REQUEST ]; then
            payload="$(cat production/jeju19s/GEN_REQUEST)"
          fi
          if [ -z "$payload" ]; then payload='{"mode":"clips","workers":2}'; fi
          mode="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("mode", "clips"))' <<< "$payload")"
          if [ "$mode" != "status" ] && [ "$mode" != "retrieve" ] && [ -f production/jeju19s/CANCEL_REQUEST ]; then
            echo 'Cancellation requested; no Agnes creation requests will be made.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$mode" = "render" ]; then
            log_file="$RUNNER_TEMP/jeju19s-render.log"
            set +e
            python3 production/jeju19s/build_audio_manifest.py 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              python3 production/jeju19s/generate.py --render-only --publish 2>&1 | tee -a "$log_file"
              status=${PIPESTATUS[0]}
            fi
            if [ "$status" -ne 0 ]; then
              mkdir -p production/jeju19s/qa
              cp "$log_file" production/jeju19s/qa/render-failure.log
              git add -- production/jeju19s/qa/render-failure.log
              if ! git diff --cached --quiet -- production/jeju19s/qa/render-failure.log; then
                git commit -m "jeju19s: retain render failure diagnostics" -- production/jeju19s/qa/render-failure.log
                git push origin arena/5375d891-desktop-tutorial
              fi
              exit "$status"
            fi
            exit 0
          elif [ "$mode" = "clips" ]; then
            test -n "$AGNES_API_KEY"
            python3 production/jeju19s/build_story.py
            python3 production/jeju19s/preflight.py
            python3 production/jeju19s/generate.py --validate --clips-only
            python3 -u production/jeju19s/generate.py --clips-only --payload "$payload" --publish
          else
            echo "Unsupported continuation mode: $mode" >&2
            exit 2
          fi

      - name: Upload footage, provenance and QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jeju19s-${{ github.run_number }}
          path: |
            work/jeju19s/
            交付/
            production/jeju19s/results.json
            production/jeju19s/qa/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
