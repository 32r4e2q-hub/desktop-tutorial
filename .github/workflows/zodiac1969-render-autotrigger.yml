name: 十二宫杀手 · 出片（push 触发）
run-name: 出片 · zodiac1969（含音量实测）

# 本分支上的 push 触发器：改动 .render-trigger 文件即跑完整出片流程
# （校验 → 按 SHA-256 从 CDN 回填素材 → 剪辑混音成品复测 → 成片与报告 commit 回本分支）。
# 与通用出片工作流 commentary-render.yml 的步骤一致（该工作流只能由默认分支调度，
# 本分支上无法 API 触发，故用 push 触发器补齐），实际流程在 production/run_project.sh。

on:
  push:
    branches: [arena/01a08a23-desktop-tutorial]
    paths:
      - 'production/zodiac1969/.render-trigger'

permissions:
  contents: write

concurrency:
  group: zodiac1969-render-arena-01a08a23
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == 'refs/heads/arena/01a08a23-desktop-tutorial'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out this Arena production branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a08a23-desktop-tutorial
          fetch-depth: 1

      - name: Install media tools and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          ffmpeg -hide_banner -version | head -1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install render dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pillow>=10,<13" "numpy>=1.26,<3" "faster-whisper>=1.1,<2" || \
          python -m pip install --break-system-packages "pillow>=10,<13" "numpy>=1.26,<3" "faster-whisper>=1.1,<2"

      - name: Validate, restore footage, render with measured audio, publish reports
        env:
          PROJECT: zodiac1969
          SKIP_ASR: "false"
          FILM_NAME: ""
          BRANCH: arena/01a08a23-desktop-tutorial
        run: bash production/run_project.sh "$PROJECT" "$SKIP_ASR" "$FILM_NAME"

      - name: Upload the finished film
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zodiac1969-成片-${{ github.run_number }}
          path: work/zodiac1969/*.mp4
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
