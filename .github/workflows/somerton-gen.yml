name: 塔玛姆·舒德 · Agnes动画生成与三分钟出片
run-name: ${{ github.event_name == 'push' && '塔玛姆·舒德 · Agnes Video 2.5 Flash S01 canary → 全量生成' || '塔玛姆·舒德 · Agnes Video 2.5 Flash 全量生成与三分钟成片' }}

on:
  # Workflow or storyboard-prompt updates probe S01, then continue/resume full production.
  # Results/QA checkpoint pushes do not touch these paths, so they cannot create a rerun loop.
  push:
    branches:
      - arena/dc7c8423-desktop-tutorial
    paths:
      - .github/workflows/somerton-gen.yml
      - production/somerton/build_story.py
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON: 全量默认 {"workers":2}; 单镜试跑 {"only":"S01","workers":1}'
        type: string
        default: '{"workers":2}'

permissions:
  contents: write
  actions: write

concurrency:
  group: somerton-agnes-arena-dc7c8423-desktop-tutorial
  cancel-in-progress: false

jobs:
  produce:
    if: github.ref == 'refs/heads/arena/dc7c8423-desktop-tutorial'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 360
    steps:
      - name: Check out the fixed Arena production branch
        uses: actions/checkout@v4
        with:
          ref: arena/dc7c8423-desktop-tutorial
          fetch-depth: 1

      - name: Install FFmpeg, Chinese fonts and offline render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk python3-numpy python3-pil

      - name: Rebuild the single-source storyboard and narration manifest
        run: python3 production/somerton/build_story.py

      - name: Validate all prompts, voice clips and the 180-second timeline
        run: python3 production/somerton/generate.py --validate

      - name: Generate all Agnes Video 2.5 Flash clips with 61s retries, then render the 1080P first cut
        id: generate
        continue-on-error: true
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          PAYLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.payload || '{"only":"S01","workers":2,"canary_then_full":true}' }}
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 330m \
            python3 -u production/somerton/generate.py --publish --payload "$PAYLOAD"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Dispatch an automatic continuation if the generation time budget expires
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATOR_EXIT_CODE: ${{ steps.generate.outputs.exit_code }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          code_text = os.environ.get("GENERATOR_EXIT_CODE", "")
          try:
              exit_code = int(code_text)
          except ValueError:
              raise SystemExit("Generator step did not publish an exit code; refusing an automatic retry.")
          with Path("production/somerton/results.json").open(encoding="utf-8") as stream:
              result = json.load(stream)
          phase = result.get("phase")
          if exit_code == 0:
              if phase in {"first_cut_ready", "selected_sources_ready"}:
                  print(f"Generation completed successfully (phase={phase}).")
                  raise SystemExit(0)
              raise SystemExit(f"Generator exited 0 with unexpected phase={phase!r}; not dispatching.")
          if exit_code != 124:
              raise SystemExit(f"Generator failed with exit code {exit_code}; not auto-dispatching a fatal failure.")
          if str(result.get("run_id")) != os.environ.get("GITHUB_RUN_ID"):
              raise SystemExit("Checkpoint belongs to a different run; refusing an automatic retry.")
          if phase == "first_cut_ready" and result.get("delivery"):
              print("The 180-second first cut was completed before the time guard fired.")
              raise SystemExit(0)
          if phase not in {"generating_sources", "rendering_first_cut"}:
              raise SystemExit(f"Timed out in phase={phase!r}; not auto-dispatching an unsafe state.")
          terminal = {
              shot_id: row.get("status")
              for shot_id, row in result.get("shots", {}).items()
              if row.get("status") in {"failed", "blocked"}
          }
          if terminal:
              raise SystemExit(f"Fatal shot states prevent auto-dispatch: {terminal}")
          required = result.get("required_generated_shots", [])
          if phase == "rendering_first_cut" and any(
              result.get("shots", {}).get(shot_id, {}).get("status") != "completed"
              for shot_id in required
          ):
              raise SystemExit("Render phase has incomplete sources; refusing an automatic retry.")

          repository = os.environ["GITHUB_REPOSITORY"]
          ref = os.environ["GITHUB_REF_NAME"]
          payload = json.dumps({"workers": 2}, separators=(",", ":"))
          request_body = json.dumps({
              "ref": ref,
              "inputs": {"payload": payload},
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/workflows/somerton-gen.yml/dispatches",
              data=request_body,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print(f"Continuation dispatched for {ref} (HTTP {response.status}); unfinished clips will resume.")
          except urllib.error.HTTPError as error:
              detail = error.read().decode("utf-8", "replace")[:1000]
              raise SystemExit(f"Continuation dispatch failed (HTTP {error.code}): {detail}")
          PY

      - name: Upload the film, cover, subtitles, Agnes clips and QC contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somerton-3min-agnes-${{ github.run_number }}
          path: |
            work/somerton/clips/
            work/somerton/edit/delivery/
            work/somerton/edit/塔玛姆·舒德_字幕.srt
            production/somerton/results.json
            production/somerton/qa/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Dispatch automated QC for a completed 180-second cut
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: arena/dc7c8423-desktop-tutorial
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          result = json.loads(Path("production/somerton/results.json").read_text(encoding="utf-8"))
          if result.get("phase") != "first_cut_ready":
              print(f"Skipping QC dispatch; production phase={result.get('phase')!r} is not a completed cut.")
              raise SystemExit(0)
          repository = os.environ["GITHUB_REPOSITORY"]
          body = json.dumps({
              "ref": os.environ["TARGET_BRANCH"],
              "inputs": {
                  "source_run_id": os.environ["GITHUB_RUN_ID"],
                  "artifact_name": f"somerton-3min-agnes-{os.environ['GITHUB_RUN_NUMBER']}",
              },
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/workflows/somerton-qa.yml/dispatches",
              data=body,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print(f"QC dispatched for production run {os.environ['GITHUB_RUN_ID']} / artifact somerton-3min-agnes-{os.environ['GITHUB_RUN_NUMBER']} (HTTP {response.status}).")
          except urllib.error.HTTPError as error:
              detail = error.read().decode("utf-8", "replace")[:1000]
              print(f"QC dispatch failed (HTTP {error.code}): {detail}")
              raise SystemExit(1)
          PY
