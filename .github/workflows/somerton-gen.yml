name: 塔玛姆·舒德 · Agnes动画生成与三分钟出片
run-name: ${{ github.event_name == 'push' && '塔玛姆·舒德 · Agnes Video 2.5 Flash S01 canary → 全量生成' || '塔玛姆·舒德 · Agnes Video 2.5 Flash 全量生成与三分钟成片' }}

on:
  # A workflow-file update on the fixed branch probes S01, then continues full production only if it succeeds.
  # Results/QA checkpoint pushes do not touch this path, so they cannot create a rerun loop.
  push:
    branches:
      - arena/dc7c8423-desktop-tutorial
    paths:
      - .github/workflows/somerton-gen.yml
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON: 全量默认 {"workers":2}; 单镜试跑 {"only":"S01","workers":1}'
        type: string
        default: '{"workers":2}'

permissions:
  contents: write

concurrency:
  group: somerton-agnes-arena-dc7c8423-desktop-tutorial
  cancel-in-progress: false

jobs:
  produce:
    if: github.ref == 'refs/heads/arena/dc7c8423-desktop-tutorial'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 350
    steps:
      - name: Check out the fixed Arena production branch
        uses: actions/checkout@v4
        with:
          ref: arena/dc7c8423-desktop-tutorial
          fetch-depth: 1

      - name: Install FFmpeg, Chinese fonts and offline render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk python3-numpy python3-pil

      - name: Rebuild the single-source storyboard and narration manifest
        run: python3 production/somerton/build_story.py

      - name: Validate all prompts, voice clips and the 180-second timeline
        run: python3 production/somerton/generate.py --validate

      - name: Generate 29 real Agnes Video 2.5 Flash 720P motion clips and render the 1080P first cut
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          PAYLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.payload || '{"only":"S01","workers":1,"canary_then_full":true}' }}
        run: python3 -u production/somerton/generate.py --publish --payload "$PAYLOAD"

      - name: Upload the film, cover, subtitles, Agnes clips and QC contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somerton-3min-agnes-${{ github.run_number }}
          path: |
            work/somerton/clips/
            work/somerton/edit/delivery/
            work/somerton/edit/塔玛姆·舒德_字幕.srt
            production/somerton/results.json
            production/somerton/qa/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
