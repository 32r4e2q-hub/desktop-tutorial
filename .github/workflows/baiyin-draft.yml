name: 白银案 · 初剪及技术校验
on:
  push:
    branches: [arena/aa4972d2-desktop-tutorial]
    paths: [production/baiyin_case/DRAFT_REQUEST]
permissions:
  contents: write
concurrency:
  group: baiyin-canary-aa4972d2
  cancel-in-progress: false
jobs:
  draft:
    if: github.ref == 'refs/heads/arena/aa4972d2-desktop-tutorial'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/aa4972d2-desktop-tutorial
          fetch-depth: 1
      - name: Install media tools and CJK font
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/media" --no-save --ignore-scripts --no-audit --no-fund @ffmpeg-installer/linux-x64@4.1.0 @ffprobe-installer/linux-x64@5.2.0
          mkdir -p "$RUNNER_TEMP/media/bin" "$HOME/.local/share/fonts"
          chmod +x "$RUNNER_TEMP/media/node_modules/@ffmpeg-installer/linux-x64/ffmpeg" "$RUNNER_TEMP/media/node_modules/@ffprobe-installer/linux-x64/ffprobe"
          ln -s "$RUNNER_TEMP/media/node_modules/@ffmpeg-installer/linux-x64/ffmpeg" "$RUNNER_TEMP/media/bin/ffmpeg"
          ln -s "$RUNNER_TEMP/media/node_modules/@ffprobe-installer/linux-x64/ffprobe" "$RUNNER_TEMP/media/bin/ffprobe"
          echo "$RUNNER_TEMP/media/bin" >> "$GITHUB_PATH"
          gh api -H 'Accept: application/vnd.github.raw' 'repos/notofonts/noto-cjk/contents/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf?ref=f8d157532fbfaeda587e826d4cd5b21a49186f7c' > "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
          if command -v fc-cache >/dev/null; then fc-cache -f "$HOME/.local/share/fonts"; fi
          python3 -m pip install --no-input --disable-pip-version-check numpy av
      - name: Require all five variety redo receipts
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          p = Path('production/baiyin_case/qa/variety_redo.json')
          doc = json.loads(p.read_text())
          shots = doc['shots']
          assert set(shots) == {'S14','S20','S22','S23','S26'}, 'redo set incomplete'
          assert all(r.get('status') == 'completed' and r.get('sha256') and r.get('video_url') for r in shots.values()), 'redo not completed'
          PYCODE
      - name: Render a review-only draft
        run: python3 -u production/baiyin_case/render_draft.py
      - name: Verify 180-second master, allowing only the explicitly silent opening
        run: |
          python3 production/verify_master.py \
            --film work/baiyin_case/draft/baiyin_firstcut_review.mp4 \
            --story production/baiyin_case/story.json \
            --srt work/baiyin_case/draft/baiyin_subtitles.srt \
            --json work/baiyin_case/draft/verify_report.json
      - name: Persist review cut and sampled frames (not release approval)
        run: |
          set -euo pipefail
          src=work/baiyin_case/draft/baiyin_firstcut_review.mp4
          size=$(wc -c < "$src")
          test "$size" -lt 95000000 || { echo 'Review cut too large for Git; artifact will still be uploaded.'; exit 1; }
          mkdir -p production/baiyin_case/qa/master 交付
          ffprobe -v error -show_format -show_streams -of json "$src" > production/baiyin_case/qa/master/ffprobe.json
          cp work/baiyin_case/draft/verify_report.json production/baiyin_case/qa/master/verify_report.json
          cp work/baiyin_case/draft/source_manifest.json production/baiyin_case/qa/master/source_manifest.json
          ffmpeg -hide_banner -loglevel error -y -i "$src" -vf 'fps=1/6,scale=320:180,tile=6x5' -frames:v 1 production/baiyin_case/qa/master/contact.jpg
          for t in 3 32 40 92 102 139 153 179; do
            ffmpeg -hide_banner -loglevel error -y -ss "$t" -i "$src" -frames:v 1 -q:v 2 "production/baiyin_case/qa/master/frame_${t}.jpg"
          done
          cp "$src" '交付/白银案_审片初剪_待复核.mp4'
          cp work/baiyin_case/draft/baiyin_subtitles.srt '交付/白银案_审片初剪_字幕.srt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- production/baiyin_case/qa/master '交付/白银案_审片初剪_待复核.mp4' '交付/白银案_审片初剪_字幕.srt'
          if ! git diff --cached --quiet; then
            git commit -m 'baiyin: update review draft and technical evidence'
            for n in 1 2 3; do
              if git push origin HEAD:refs/heads/arena/aa4972d2-desktop-tutorial; then break; fi
              test "$n" -lt 3
              git pull --rebase origin arena/aa4972d2-desktop-tutorial
            done
          fi
      - name: Upload review draft and technical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baiyin-firstcut-review-${{ github.run_number }}
          path: |
            work/baiyin_case/draft/baiyin_firstcut_review.mp4
            work/baiyin_case/draft/baiyin_subtitles.srt
            work/baiyin_case/draft/verify_report.json
            work/baiyin_case/draft/source_manifest.json
          if-no-files-found: warn
          retention-days: 7
