name: 铅面具事件 · Agnes 2.5 Flash 生成与三分钟成片
run-name: ${{ github.event_name == 'push' && '铅面具事件 · Agnes Video 2.5 Flash 生成/出片' || '铅面具事件 · 手动生成或出片' }}

# 触发方式（沙箱 token 没有 actions:write，gh workflow run 会 403，所以用 marker 文件）：
#   production/leadmask1966/RENDER_REQUEST  → 只出片（旁白/素材齐了以后用，优先级最高）
#   production/leadmask1966/GEN_REQUEST     → 生成片段（{"only":"S22"} 单镜 / {"mode":"clips"} 全量）
# 所有日志都写进仓库目录（不是 /tmp）：沙箱读不到 Actions 日志，只能靠分支上的 run.log 自述。
on:
  push:
    branches:
      - arena/1cf9df35-desktop-tutorial
    paths:
      - .github/workflows/leadmask1966-gen.yml
      - production/leadmask1966/GEN_REQUEST
      - production/leadmask1966/RENDER_REQUEST
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON：{"mode":"render"} / {"only":"S22"} / {"mode":"clips","workers":2}'
        type: string
        default: '{"only":"S01","workers":2,"canary_then_full":true}'

permissions:
  contents: write
  actions: write

concurrency:
  group: leadmask1966-agnes-arena-1cf9df35-desktop-tutorial-v5
  cancel-in-progress: false

jobs:
  produce:
    if: >-
      github.ref == 'refs/heads/arena/1cf9df35-desktop-tutorial' &&
      !contains(github.event.head_commit.message, '[skip-leadmask1966]')
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 340
    env:
      DEBIAN_FRONTEND: noninteractive
      TARGET_BRANCH: arena/1cf9df35-desktop-tutorial
      RUN_LOG: production/leadmask1966/run.log
    steps:
      - name: Check out the fixed Arena production branch
        uses: actions/checkout@v4
        with:
          ref: arena/1cf9df35-desktop-tutorial
          fetch-depth: 1

      - name: Prepare the on-branch run log
        run: |
          set -u
          mkdir -p production/leadmask1966
          : > "$RUN_LOG"
          {
            echo "run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} ref=${GITHUB_REF_NAME}"
            echo "event=${GITHUB_EVENT_NAME} runner=${RUNNER_NAME} os=${RUNNER_OS} arch=${RUNNER_ARCH}"
            echo "sha=${GITHUB_SHA}"
            date -u +"started %FT%TZ"
            python3 --version 2>&1 || echo "python3 missing"
            command -v ffmpeg || echo "ffmpeg missing"
            command -v ffprobe || echo "ffprobe missing"
          } >> "$RUN_LOG"
          git config user.name "arena-autopilot"
          git config user.email "arena-autopilot@users.noreply.github.com"

      - name: Resolve the payload (render marker wins over a generation marker)
        env:
          PAYLOAD_INPUT: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          if [ -n "${PAYLOAD_INPUT:-}" ]; then
            payload="$PAYLOAD_INPUT"
          elif [ -f production/leadmask1966/RENDER_REQUEST ]; then
            payload='{"mode":"render","workers":1}'
          elif [ -f production/leadmask1966/GEN_REQUEST ]; then
            payload="$(tr -d '\n' < production/leadmask1966/GEN_REQUEST)"
          else
            payload='{"only":"S01","workers":2,"canary_then_full":true}'
          fi
          printf 'payload=%s\n' "$payload" >> "$RUN_LOG"
          echo "PAYLOAD=$payload" >> "$GITHUB_ENV"
          echo "payload: $payload"

      - name: Probe FFmpeg and Chinese fonts, downloading them instead of waiting on apt
        timeout-minutes: 12
        run: |
          set -uo pipefail
          echo "== tools ==" >> "$RUN_LOG"
          echo "ffmpeg=$(command -v ffmpeg || echo none) ffprobe=$(command -v ffprobe || echo none)" >> "$RUN_LOG"
          echo "cjk_fonts_before=$(fc-list :lang=zh 2>/dev/null | wc -l)" >> "$RUN_LOG"
          python3 - >> "$RUN_LOG" 2>&1 <<'PY' || echo "module probe failed" >> "$RUN_LOG"
          import importlib.util
          for name in ("numpy", "PIL", "yaml", "av"):
              print(f"{name}: {'ok' if importlib.util.find_spec(name) else 'MISSING'}")
          PY

          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            echo "installing ffmpeg via apt" >> "$RUN_LOG"
            timeout 240 sudo -E apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 update -qq >> "$RUN_LOG" 2>&1 || echo "apt update failed" >> "$RUN_LOG"
            timeout 240 sudo -E apt-get -y -qq --no-install-recommends install ffmpeg >> "$RUN_LOG" 2>&1 \
              || echo "apt ffmpeg failed" >> "$RUN_LOG"
          fi

          mkdir -p "$HOME/.local/share/fonts" .cache/fonts
          if [ -z "$(fc-list :lang=zh 2>/dev/null | head -1)" ] && [ -z "$(ls -A .cache/fonts 2>/dev/null)" ]; then
            echo "downloading CJK fonts" >> "$RUN_LOG"
            base="https://raw.githubusercontent.com/notofonts/noto-cjk/main"
            for spec in \
              "Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf" \
              "Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Bold.otf" \
              "Serif/OTF/SimplifiedChinese/NotoSerifCJKsc-Regular.otf"; do
              name="$(basename "$spec")"
              if timeout 180 curl -fsSL "$base/$spec" -o ".cache/fonts/$name"; then
                cp ".cache/fonts/$name" "$HOME/.local/share/fonts/$name"
                echo "font ok: $name" >> "$RUN_LOG"
              else
                echo "font download failed: $name" >> "$RUN_LOG"
              fi
            done
            fc-cache -f >/dev/null 2>&1 || true
          fi
          echo "cjk_fonts_after=$(fc-list :lang=zh 2>/dev/null | wc -l)" >> "$RUN_LOG"
          ls -l .cache/fonts >> "$RUN_LOG" 2>&1 || true
          ffmpeg -version 2>/dev/null | head -1 >> "$RUN_LOG" || echo "ffmpeg still missing" >> "$RUN_LOG"
          ffprobe -version 2>/dev/null | head -1 >> "$RUN_LOG" || echo "ffprobe still missing" >> "$RUN_LOG"
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            echo "::error::ffmpeg/ffprobe unavailable on this runner; refusing to continue."
            echo "stage=tools_missing" >> "$RUN_LOG"
            exit 1
          fi
          echo "stage=tools_ready" >> "$RUN_LOG"

      - name: Rebuild the storyboard, validate the plan and run the offline tests
        run: |
          echo "== plan ==" >> "$RUN_LOG"
          python3 production/leadmask1966/build_story.py >> "$RUN_LOG" 2>&1 || { echo "stage=build_failed" >> "$RUN_LOG"; exit 1; }
          echo "stage=build_ok" >> "$RUN_LOG"
          mode=$(python3 -c "import json,os;d=json.loads(os.environ.get('PAYLOAD') or '{}');print(d.get('mode') or ('clips' if d.get('only') else 'full'))")
          echo "validation mode: $mode" >> "$RUN_LOG"
          if [ "$mode" = "render" ] || [ "$mode" = "full" ]; then
            python3 production/leadmask1966/generate.py --validate >> "$RUN_LOG" 2>&1 || { echo "stage=validate_failed" >> "$RUN_LOG"; exit 1; }
          else
            python3 production/leadmask1966/generate.py --validate --clips-only >> "$RUN_LOG" 2>&1 || { echo "stage=validate_failed" >> "$RUN_LOG"; exit 1; }
          fi
          echo "stage=validate_ok" >> "$RUN_LOG"
          python3 -m unittest production.tests.test_leadmask1966 -v >> "$RUN_LOG" 2>&1 || { echo "stage=tests_failed" >> "$RUN_LOG"; exit 1; }
          echo "stage=tests_ok" >> "$RUN_LOG"

      - name: Publish the plan checkpoint
        run: |
          set -uo pipefail
          git add -f "$RUN_LOG" production/leadmask1966/stage.log 2>/dev/null || true
          git add production/leadmask1966/audio/manifest.json production/leadmask1966/story.json 2>/dev/null || true
          git commit -q -m "leadmask1966: run ${GITHUB_RUN_ID} plan checkpoint [skip-leadmask1966]" || true
          git pull --rebase -q origin "$TARGET_BRANCH" || true
          git push -q origin "HEAD:$TARGET_BRANCH" || true

      - name: Generate with Agnes Video 2.5 Flash (62s gate) and/or render the 1080P cut
        id: generate
        continue-on-error: true
        timeout-minutes: 300
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          PAYLOAD: ${{ env.PAYLOAD }}
        run: |
          set +e
          echo "agnes_key_present=$([ -n "${AGNES_API_KEY:-}" ] && echo yes || echo no)" >> "$RUN_LOG"
          echo "== generator ==" >> "$RUN_LOG"
          timeout --signal=TERM --kill-after=30s 285m \
            python3 -u production/leadmask1966/generate.py --publish --payload "$PAYLOAD" >> "$RUN_LOG" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "generator_exit=$code" >> "$RUN_LOG"
          exit "$code"

      - name: Dispatch an automatic continuation when the time budget expires
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATOR_EXIT_CODE: ${{ steps.generate.outputs.exit_code }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          try:
              exit_code = int(os.environ.get("GENERATOR_EXIT_CODE", ""))
          except ValueError:
              raise SystemExit("Generator step did not publish an exit code; refusing an automatic retry.")
          result = json.loads(Path("production/leadmask1966/results.json").read_text(encoding="utf-8"))
          phase = result.get("phase")
          if exit_code == 0:
              print(f"Generator finished cleanly (phase={phase}).")
              raise SystemExit(0)
          if exit_code != 124:
              raise SystemExit(f"Generator failed with exit code {exit_code}; not auto-dispatching.")
          if str(result.get("run_id")) != os.environ.get("GITHUB_RUN_ID"):
              raise SystemExit("Checkpoint belongs to a different run; refusing an automatic retry.")
          if phase not in {"generating_sources", "rendering_first_cut"}:
              raise SystemExit(f"Timed out in phase={phase!r}; not auto-dispatching.")
          if any(row.get("status") in {"failed", "blocked"}
                 for row in result.get("shots", {}).values()):
              raise SystemExit("Fatal shot states prevent auto-dispatch.")
          body = json.dumps({"ref": os.environ["GITHUB_REF_NAME"],
                             "inputs": {"payload": '{"mode":"clips","workers":2}'}}).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
              "/actions/workflows/leadmask1966-gen.yml/dispatches",
              data=body, method="POST",
              headers={"Accept": "application/vnd.github+json",
                       "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "X-GitHub-Api-Version": "2022-11-28",
                       "Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print(f"Continuation dispatched (HTTP {response.status}); unfinished clips resume.")
          except urllib.error.HTTPError as error:
              print(f"Continuation dispatch failed (HTTP {error.code}): "
                    f"{error.read().decode('utf-8', 'replace')[:800]}")
              raise SystemExit(1)
          PY

      - name: Ship the run log and results to the branch
        if: always()
        env:
          GENERATOR_EXIT_CODE: ${{ steps.generate.outputs.exit_code }}
        run: |
          set -uo pipefail
          echo "stage=finished exit=${GENERATOR_EXIT_CODE:-unknown}" >> "$RUN_LOG"
          git add -f "$RUN_LOG" production/leadmask1966/stage.log 2>/dev/null || true
          git add -f production/leadmask1966/results.json 2>/dev/null || true
          git add -A 交付 production/leadmask1966/qa 2>/dev/null || true
          git commit -q -m "leadmask1966: run ${GITHUB_RUN_ID} log + delivery [skip-leadmask1966]" || true
          git pull --rebase -q origin "$TARGET_BRANCH" || true
          git push -q origin "HEAD:$TARGET_BRANCH" || true

      - name: Upload the film, cover, subtitles, Agnes clips and QC contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leadmask1966-agnes-${{ github.run_number }}
          path: |
            work/leadmask1966/clips/
            work/leadmask1966/edit/delivery/
            work/leadmask1966/edit/*.srt
            交付/
            production/leadmask1966/results.json
            production/leadmask1966/run.log
            production/leadmask1966/qa/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
