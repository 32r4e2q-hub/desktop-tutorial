name: 李亨浩案《四十四天的电话》· CogVideoX 动画
run-name: 李亨浩案制作 · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      cogvideo_smoke:
        description: '先用 CogVideoX 生成 3 个身份参考测试镜头，不生成旁白/整片'
        required: false
        type: boolean
        default: false
      force_tts:
        description: '强制重新生成六章 Edge TTS 旁白'
        required: false
        type: boolean
        default: false
      visual_qc:
        description: '渲染后运行逐帧视觉质量审计'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - arena/04ec3850-desktop-tutorial
    paths:
      - production/lee_hyung_ho1991/RUN_REQUEST

permissions:
  contents: write

concurrency:
  group: lee-hyung-ho1991-arena-04ec3850-desktop-tutorial
  cancel-in-progress: false

jobs:
  produce:
    if: github.ref == 'refs/heads/arena/04ec3850-desktop-tutorial'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 350
    steps:
      - name: Check out the fixed Arena production branch
        uses: actions/checkout@v4
        with:
          ref: arena/04ec3850-desktop-tutorial
          fetch-depth: 0

      - name: Install media tools and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          ffmpeg -hide_banner -version | head -1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CogVideoX, Edge TTS and render / QC dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip 2>&1 | tee -a /tmp/lee-hyung-ho-production.log
          python -m pip install "zhipuai>=2.1,<3" "sniffio>=1.3,<2" "edge-tts>=7.2,<8" \
            "numpy==1.26.4" "pillow>=10,<13" "av>=12,<16" "opencv-python-headless==4.10.0.84" \
            "matplotlib>=3.8,<4" "absl-py>=2,<3" "attrs>=19.1" \
            "flatbuffers>=2" "protobuf>=4.25.3,<5" 2>&1 | tee -a /tmp/lee-hyung-ho-production.log
          python -m pip install --no-deps "mediapipe==0.10.21" 2>&1 | tee -a /tmp/lee-hyung-ho-production.log
          python - <<'PY' 2>&1 | tee -a /tmp/lee-hyung-ho-production.log
          import importlib.metadata as metadata
          import av, cv2, edge_tts, mediapipe as mp, numpy as np, PIL, zhipuai
          assert cv2.__version__ == '4.10.0'
          assert mp.__version__ == '0.10.21'
          print('runtime ready', 'av', av.__version__, 'opencv', cv2.__version__,
                'mediapipe', mp.__version__, 'numpy', np.__version__,
                'edge-tts', metadata.version('edge-tts'), 'zhipuai', metadata.version('zhipuai'))
          PY

      - name: Build the checked screenplay and resolve this run
        id: resolve
        env:
          DISPATCH_FORCE_TTS: ${{ inputs.force_tts }}
          DISPATCH_COGVIDEO_SMOKE: ${{ inputs.cogvideo_smoke }}
        run: |
          set -euo pipefail
          python production/lee_hyung_ho1991/build_story.py
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os
          from pathlib import Path
          request = json.loads(Path('production/lee_hyung_ho1991/RUN_REQUEST').read_text())
          dispatch_force = os.getenv('DISPATCH_FORCE_TTS', '').lower() == 'true'
          dispatch_smoke = os.getenv('DISPATCH_COGVIDEO_SMOKE', '').lower() == 'true'
          request_smoke = bool(request.get('cogvideo_smoke', False)) if isinstance(request, dict) else False
          smoke = dispatch_smoke or request_smoke
          if isinstance(request, dict) and 'payload' in request:
              payload = request.get('payload') or {}
              force = bool(request.get('force_tts', False)) or dispatch_force
          else:
              payload = request
              force = dispatch_force
          if smoke:
              payload = {'only': 'S05,S12,S16'}
          elif payload.get('only'):
              raise SystemExit('Only-shot requests are allowed through the cogvideo_smoke request flag or workflow input.')
          print('PAYLOAD=' + json.dumps(payload, ensure_ascii=False, separators=(',', ':')))
          print('FORCE_TTS=' + ('true' if force else 'false'))
          print('SMOKE_TEST=' + ('true' if smoke else 'false'))
          PY
          echo "Resolved CogVideoX payload, Edge TTS/cache policy, and smoke-test flag."

      - name: Validate the 45-shot CogVideoX plan and character references
        run: python production/lee_hyung_ho1991/generate.py --validate

      - name: Generate animated clips with Zhipu CogVideoX-Flash only
        env:
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
        run: |
          set -euo pipefail
          python -u production/lee_hyung_ho1991/generate.py --publish --payload "$PAYLOAD" 2>&1 | tee -a /tmp/lee-hyung-ho-production.log

      - name: Restore SHA-verified CogVideoX clips from provider receipts
        if: ${{ env.SMOKE_TEST != 'true' }}
        run: |
          python production/lee_hyung_ho1991/fetch_sources.py \
            --dest work/lee_hyung_ho1991/sources 2>&1 | tee -a /tmp/lee-hyung-ho-production.log

      - name: Build cross-shot character identity review sheets
        if: ${{ env.SMOKE_TEST != 'true' }}
        run: |
          python production/lee_hyung_ho1991/character_consistency_audit.py \
            --sources work/lee_hyung_ho1991/sources \
            --out work/lee_hyung_ho1991/character-consistency 2>&1 | tee -a /tmp/lee-hyung-ho-production.log

      - name: Generate or reuse verified Edge TTS narration and cut timings
        if: ${{ env.SMOKE_TEST != 'true' }}
        run: |
          set -euo pipefail
          if [ "$FORCE_TTS" = "true" ]; then
            python -u production/lee_hyung_ho1991/prepare_tts.py --force --publish 2>&1 | tee -a /tmp/lee-hyung-ho-production.log
          else
            python -u production/lee_hyung_ho1991/prepare_tts.py --publish 2>&1 | tee -a /tmp/lee-hyung-ho-production.log
          fi

      - name: Validate all shots and narration provenance
        if: ${{ env.SMOKE_TEST != 'true' }}
        run: python production/lee_hyung_ho1991/generate.py --validate --require-audio

      - name: Render the 180-second film with measured audio and subtitles
        if: ${{ env.SMOKE_TEST != 'true' }}
        run: |
          set -euo pipefail
          python -u production/lee_hyung_ho1991/render.py \
            --sources work/lee_hyung_ho1991/sources \
            --work work/lee_hyung_ho1991/render \
            --output 'work/lee_hyung_ho1991/李亨浩_四十四天的电话_三分钟.mp4' \
            --skip-asr 2>&1 | tee -a /tmp/lee-hyung-ho-production.log

      - name: Publish compact render receipts and contact sheet to the branch
        if: ${{ env.SMOKE_TEST != 'true' }}
        run: |
          set -euo pipefail
          project='production/lee_hyung_ho1991'
          delivery="$project/delivery"
          mkdir -p "$delivery" "$project/qa"
          cp work/lee_hyung_ho1991/render/edit-decision-list.json "$delivery/"
          cp work/lee_hyung_ho1991/render/technical-report.json "$delivery/"
          cp work/lee_hyung_ho1991/render/audio-report.json "$delivery/"
          cp work/lee_hyung_ho1991/render/final-audio-report.json "$delivery/"
          cp work/lee_hyung_ho1991/render/alignment-report.json "$delivery/"
          cp work/lee_hyung_ho1991/render/final-contact.jpg "$project/qa/final-contact.jpg"
          mkdir -p "$project/qa/character-consistency"
          cp work/lee_hyung_ho1991/character-consistency/*.jpg "$project/qa/character-consistency/"
          cp work/lee_hyung_ho1991/character-consistency/summary.json "$delivery/character-consistency.json"
          if [ -f "$project/last-run.log" ]; then
            rm "$project/last-run.log"
            git add -u "$project/last-run.log"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$delivery" "$project/qa/final-contact.jpg" "$project/qa/character-consistency"
          if ! git diff --cached --quiet; then
            git commit -m 'lee_hyung_ho1991: publish verified render and identity review receipts'
            git push origin arena/04ec3850-desktop-tutorial
          fi

      - name: Audit every delivered frame and create a visual review summary
        if: ${{ env.SMOKE_TEST != 'true' && (github.event_name != 'workflow_dispatch' || inputs.visual_qc) }}
        run: |
          set -euo pipefail
          film='work/lee_hyung_ho1991/李亨浩_四十四天的电话_三分钟.mp4'
          python -u production/lee_hyung_ho1991/audit_frame_distortions.py \
            --film "$film" \
            --project production/lee_hyung_ho1991 \
            --out work/lee_hyung_ho1991/frame-distortion-audit.json \
            --work work/lee_hyung_ho1991/frame-audit 2>&1 | tee -a /tmp/lee-hyung-ho-production.log
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('work/lee_hyung_ho1991/frame-distortion-audit.json').read_text())
          checks = report['checks']
          summary = {
              'status': report['status'],
              'video': report['video'],
              'checks': {
                  'pts_issues': len(checks['pts_issues']),
                  'unplanned_black_frames': checks['unplanned_black_frame_count'],
                  'non_graphic_freeze_runs': len(checks['non_graphic_freeze_runs']),
                  'temporal_outlier_windows': len(checks['temporal_outlier_windows']),
                  'face_review_candidates': len(checks['face_review_candidates']),
                  'hand_geometry_events': len(checks['hand_landmark_extreme_events']),
              },
              'shot_summary': report['shot_summary'],
              'character_identity_review': 'reference image hashes and the contact sheets are included; generation is probabilistic, so final semantic approval remains visual',
              'human_visual_review': 'pending; automated screening is triage, not sign-off',
          }
          out = Path('production/lee_hyung_ho1991/delivery/visual-qc-summary.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n')
          Path('production/lee_hyung_ho1991/delivery/frame-distortion-audit.md').write_text(
              Path('work/lee_hyung_ho1991/frame-distortion-audit.md').read_text())
          print('VISUAL_QC_SUMMARY', json.dumps(summary['checks'], ensure_ascii=False))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/lee_hyung_ho1991/delivery/visual-qc-summary.json \
            production/lee_hyung_ho1991/delivery/frame-distortion-audit.md
          if ! git diff --cached --quiet; then
            git commit -m 'lee_hyung_ho1991: record automated frame QC'
            git push origin arena/04ec3850-desktop-tutorial
          fi

      - name: Preserve failure diagnostics without exposing secrets
        if: failure()
        run: |
          set -euo pipefail
          project='production/lee_hyung_ho1991'
          if [ -f /tmp/lee-hyung-ho-production.log ]; then
            tail -c 200000 /tmp/lee-hyung-ho-production.log > "$project/last-run.log"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$project/last-run.log"
            if ! git diff --cached --quiet; then
              git commit -m 'lee_hyung_ho1991: preserve production diagnostics'
              git push origin arena/04ec3850-desktop-tutorial || {
                git fetch origin arena/04ec3850-desktop-tutorial
                git rebase FETCH_HEAD
                git push origin arena/04ec3850-desktop-tutorial
              }
            fi
          fi

      - name: Upload the film, CogVideoX smoke clips and review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lee-hyung-ho-production-${{ github.run_number }}
          path: |
            work/lee_hyung_ho1991/李亨浩_四十四天的电话_三分钟.mp4
            work/lee_hyung_ho1991/sources/S05.mp4
            work/lee_hyung_ho1991/sources/S12.mp4
            work/lee_hyung_ho1991/sources/S16.mp4
            work/lee_hyung_ho1991/render/final-contact.jpg
            work/lee_hyung_ho1991/render/captions.srt
            work/lee_hyung_ho1991/render/technical-report.json
            work/lee_hyung_ho1991/render/audio-report.json
            work/lee_hyung_ho1991/render/final-audio-report.json
            work/lee_hyung_ho1991/render/edit-decision-list.json
            work/lee_hyung_ho1991/frame-distortion-audit.json
            work/lee_hyung_ho1991/frame-distortion-audit.md
            work/lee_hyung_ho1991/frame-audit/contacts/shot-midpoints.jpg
            work/lee_hyung_ho1991/frame-audit/suspect-frames/
            production/lee_hyung_ho1991/results.json
            production/lee_hyung_ho1991/qa/
            production/lee_hyung_ho1991/delivery/
            production/lee_hyung_ho1991/last-run.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
