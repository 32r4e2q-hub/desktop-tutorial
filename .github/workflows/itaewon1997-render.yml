name: Itaewon 1997 · render final film

on:
  workflow_dispatch:
    inputs:
      note:
        description: Optional note
        required: false
        default: render
        type: string
  push:
    branches: [arena/e8c2f70d-desktop-tutorial]
    paths:
      - production/itaewon1997/RENDER_REQUEST

permissions:
  contents: write

concurrency:
  group: itaewon1997-render
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == 'refs/heads/arena/e8c2f70d-desktop-tutorial'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/e8c2f70d-desktop-tutorial
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow numpy av
      - name: Offline checks
        run: |
          set -euo pipefail
          python production/itaewon1997/build_story.py
          python production/itaewon1997/generate_clips.py --validate
          python production/tests/test_itaewon1997.py
          python production/itaewon1997/render.py --plan-only
      - name: Render master, captions, cover
        run: python production/itaewon1997/render.py
      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: itaewon1997-final-${{ github.run_id }}
          path: work/itaewon1997/delivery/*
          retention-days: 30
      - name: Frame QA sheets
        run: python production/itaewon1997/qa_final.py
      - name: Publish QA sheets to the branch
        run: |
          set -euo pipefail
          branch=arena/e8c2f70d-desktop-tutorial
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f production/itaewon1997/qa_final
          git diff --cached --quiet && exit 0
          git commit -m "itaewon1997: final-film QA sheets"
          for attempt in 1 2 3; do
            git fetch --deepen=10 origin "$branch"
            git rebase -X theirs "origin/$branch" || { git rebase --abort; exit 1; }
            git push origin "$branch" && exit 0
            sleep 3
          done
          exit 1
      - name: Publish release with the final film
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="itaewon1997-final-${GITHUB_RUN_ID}"
          gh release create "$tag" --target arena/e8c2f70d-desktop-tutorial --title "梨泰院杀人事件 成片 (run ${GITHUB_RUN_ID})" \
            --notes "AI动画情景重现。1920x1080 / 24fps / 180s。" \
            work/itaewon1997/delivery/Itaewon1997_Final.mp4 work/itaewon1997/delivery/Itaewon1997_Cover.png \
            work/itaewon1997/delivery/captions.srt work/itaewon1997/delivery/captions.ass work/itaewon1997/delivery/Itaewon1997_Narration.wav
