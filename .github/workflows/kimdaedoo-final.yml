# 金大斗案 · 180 秒成片装配
#
# 触发：generate 工作流在 30 镜全部完成后自动 dispatch；也可 push FINAL_REQUEST 手动触发。
# 流程：下载 30 镜 → 校验 SHA-256 → edge-tts 低沉男声 → 音画对位 → 字幕 → BGM → QC → Release
name: 金大斗案 · 出片

on:
  workflow_dispatch:
  push:
    branches: [arena/b726ea5e-desktop-tutorial]
    paths:
      # 只在明确请求时出片：results.json 每轮回写，不能作为触发条件，
      # 否则每一轮生成都会拉起一次“素材不全”的出片。
      - production/kimdaedoo/FINAL_REQUEST
      - production/kimdaedoo/finalize.py
      - .github/workflows/kimdaedoo-final.yml

permissions:
  contents: write

concurrency:
  group: kimdaedoo-final
  cancel-in-progress: false

jobs:
  final:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/b726ea5e-desktop-tutorial
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install toolchain (ffmpeg / Noto CJK / edge-tts / numpy)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk zip
          python -m pip install --upgrade pip
          python -m pip install --quiet "edge-tts>=6.1,<8" "numpy>=1.26,<3"
          ffmpeg -version | head -1
          fc-list | grep -i "noto sans cjk sc" | head -1

      - name: Assemble the 180-second film
        id: assemble
        run: |
          set -o pipefail
          python3 production/kimdaedoo/finalize.py 2>&1 | tee final.log
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      # 沙箱读不到 Actions 日志（GitHub 的日志存储对我们是 EOF），失败原因必须自己搬回分支，
      # 否则只能靠猜。2026-10-22 就是这样白跑了一轮（make_bgm 未定义）。
      - name: Ship the assembly log to the branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          [ -f final.log ] || { echo "no final.log"; exit 0; }
          mkdir -p production/kimdaedoo/delivery
          {
            echo "# 出片日志（${{ job.status }}，$(date -u +%FT%TZ)）"
            echo
            echo '```'
            tail -n 160 final.log
            echo '```'
          } > production/kimdaedoo/delivery/final-log.md
          git config user.name "arena-final"
          git config user.email "arena@local"
          git add production/kimdaedoo/delivery/final-log.md
          git commit -q -m "kimdaedoo: 出片日志 ${{ job.status }} $(date -u +%FT%TZ)" || exit 0
          for attempt in 1 2 3; do
            git push origin HEAD:arena/b726ea5e-desktop-tutorial && break || {
              sleep 5; git pull --rebase origin arena/b726ea5e-desktop-tutorial || true; }
          done
          exit 0

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="kimdaedoo-v1-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            work/kimdaedoo-final/final.mp4 \
            work/kimdaedoo-final/captions.srt \
            work/kimdaedoo-final/technical-report.json \
            work/kimdaedoo-final/final-contact.jpg \
            work/kimdaedoo-final/final-per-slot.jpg \
            production/kimdaedoo/delivery/final/narration-180s.txt \
            --title "金大斗案 · 55天17条人命｜180秒成片" \
            --notes-file production/kimdaedoo/delivery/final/release-notes.md

      - name: Upload artifact (video + reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimdaedoo-final
          path: work/kimdaedoo-final/
          if-no-files-found: ignore
          retention-days: 14
