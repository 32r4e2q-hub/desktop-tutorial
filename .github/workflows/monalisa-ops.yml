# 蒙娜丽莎 · 运维（marker 驱动）：让 runner 替代理看 / 管 Actions
#
# 为什么要有它：仓库是私有的，沙箱里的 GitHub 凭据是 Arena 代理的占位 token——git 走代理有认证，
# REST / GraphQL 到 api.github.com 却等于匿名，私有仓库一律 404，代理看不到 run、也取消不了 run。
# runner 自己的 GITHUB_TOKEN（actions: write）能看能管：production/monalisa/ops_report.py 列出本分支的 run、
# 未结束生成 run 的 job/step、最近失败 job 的注解（额度 / "job was not started" 的提示就在这里），
# 按请求取消卡住的 run，写 production/monalisa/ops-report.md 并 push；同时把精简版镜像到 OPS_REQUEST 里
# 指定的 ntfy 话题（runner 推不上分支时，代理靠它读报告；只有 run 元数据和筛选、脱敏后的状态行）。
#
# 两个 job：ops-default 走 RUNNER_LABEL（未设则 GitHub-hosted），ops-self 直接走 self-hosted——
# 装了本地 runner 却没设 RUNNER_LABEL 时，只有后者能跑起来，一眼就能分辨。
# 不设并发组：某个 job 等不到 runner 时不会把后面的运维 run 堵住（下一次运维 run 会把它取消）。
#
# 触发：改 production/monalisa/OPS_REQUEST 并 push。内容（每行 key=value，可省略）：
#   action=report | cancel-stale-gen   （后者：只保留最新的未结束生成 run，其余生成 run 与其他运维 run 取消）
#   cancel=<run_id>[,<run_id>]
#   ntfy=<话题名>                       （报告镜像）

name: 蒙娜丽莎 · 运维（查看 / 取消 run）
run-name: 运维 · ${{ github.ref_name }}

on:
  push:
    branches:
      - arena/01a0dbbf-desktop-tutorial
    paths:
      - production/monalisa/OPS_REQUEST

permissions:
  contents: write
  actions: write
  checks: read

jobs:
  ops-default:
    if: github.ref == 'refs/heads/arena/01a0dbbf-desktop-tutorial'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0dbbf-desktop-tutorial
      - name: 报告 / 取消 / 镜像
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 production/monalisa/ops_report.py --job "${{ github.job }}"
      - name: 报告推回分支（结果也镜像到 ntfy）
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          git config user.name "arena-ops"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/monalisa/ops-report.md
          git commit -q -m "monalisa: 运维报告（${{ github.job }}）$(date -u +%FT%TZ)" || { python3 production/monalisa/ops_report.py --job "${{ github.job }}" --post "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            out=$(git push origin "HEAD:arena/01a0dbbf-desktop-tutorial" 2>&1) && { python3 production/monalisa/ops_report.py --job "${{ github.job }}" --post "push ok (attempt $i)"; exit 0; }
            git pull -q --rebase origin arena/01a0dbbf-desktop-tutorial >/dev/null 2>&1 || git rebase --abort >/dev/null 2>&1
            sleep 3
          done
          python3 production/monalisa/ops_report.py --job "${{ github.job }}" --post "PUSH FAILED: $(echo "$out" | tail -n 6 | tr '\n' ' ' | cut -c1-600)"
          exit 1
  ops-self:
    if: github.ref == 'refs/heads/arena/01a0dbbf-desktop-tutorial'
    runs-on: ${{ vars.RUNNER_LABEL || 'self-hosted' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0dbbf-desktop-tutorial
      - name: 报告 / 取消 / 镜像
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 production/monalisa/ops_report.py --job "${{ github.job }}"
      - name: 报告推回分支（结果也镜像到 ntfy）
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          git config user.name "arena-ops"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/monalisa/ops-report.md
          git commit -q -m "monalisa: 运维报告（${{ github.job }}）$(date -u +%FT%TZ)" || { python3 production/monalisa/ops_report.py --job "${{ github.job }}" --post "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            out=$(git push origin "HEAD:arena/01a0dbbf-desktop-tutorial" 2>&1) && { python3 production/monalisa/ops_report.py --job "${{ github.job }}" --post "push ok (attempt $i)"; exit 0; }
            git pull -q --rebase origin arena/01a0dbbf-desktop-tutorial >/dev/null 2>&1 || git rebase --abort >/dev/null 2>&1
            sleep 3
          done
          python3 production/monalisa/ops_report.py --job "${{ github.job }}" --post "PUSH FAILED: $(echo "$out" | tail -n 6 | tr '\n' ' ' | cut -c1-600)"
          exit 1
