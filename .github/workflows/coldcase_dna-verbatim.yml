name: 冷案DNA · 逐字听检
run-name: 逐字听检 · 冷案DNA破案革命 · ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0a7c0-desktop-tutorial
    paths:
      - production/coldcase_dna/VERBATIM_REQUEST

permissions:
  contents: write

concurrency:
  group: coldcase_dna-verbatim-arena-01a0a7c0-desktop-tutorial
  cancel-in-progress: false

jobs:
  verbatim:
    if: github.ref == 'refs/heads/arena/01a0a7c0-desktop-tutorial'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out this Arena production branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a0a7c0-desktop-tutorial
          fetch-depth: 1

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -version | head -1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install faster-whisper
        run: |
          python -m pip install --upgrade pip
          python -m pip install "faster-whisper>=1.1,<2" || \
          python -m pip install --break-system-packages "faster-whisper>=1.1,<2"

      - name: Run verbatim check against the finished film and clean narration
        run: |
          python3 production/verbatim_check.py \
            --film "交付/一根头发引发的破案革命_冷案复活与DNA表型分析_三分钟_带声音.mp4" \
            --project production/coldcase_dna \
            --work work/coldcase_dna/verbatim \
            --narration production/coldcase_dna/audio \
            --model small

      - name: Commit verbatim-check.json back to the branch
        run: |
          git config user.name "arena-verbatim"
          git config user.email "arena@local"
          cp work/coldcase_dna/verbatim/verbatim-check.json production/coldcase_dna/delivery/verbatim-check.json
          git add -f production/coldcase_dna/delivery/verbatim-check.json
          git commit -m "听检: 冷案DNA逐字听检报告 (faster-whisper small)" || true
          pushed=0
          for attempt in 1 2 3; do
            if git push origin "HEAD:${{ github.ref_name }}"; then pushed=1; break; fi
            git fetch origin ${{ github.ref_name }} && git rebase FETCH_HEAD || break
          done
          [ "$pushed" = "1" ] || echo "::error::未能成功推送听检报告"
