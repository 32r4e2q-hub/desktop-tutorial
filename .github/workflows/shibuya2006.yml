name: 涩谷短大生惨案 · 第17期制作
run-name: 涩谷短大生惨案 · 30镜视频制作

on:
  push:
    branches: [arena/**]
    paths:
      - production/shibuya2006/GEN_REQUEST
      - production/shibuya2006/CANCEL_REQUEST
  workflow_dispatch:
    inputs:
      payload:
        description: JSON payload, e.g. {"mode":"clips","workers":2}
        type: string
        default: '{"mode":"clips","workers":2}'

permissions:
  contents: write
  actions: read

concurrency:
  group: shibuya2006-agnes-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  produce:
    if: startsWith(github.ref, 'refs/heads/arena/')
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 300
    steps:
      - name: Checkout the current Arena branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Pin Python 3.11
        # 2026-11-16：ubuntu-latest 的默认 Python 到 3.14 后，pip 解析出的 PyAV 与
        # 调用方要求不匹配，参考图/音频相关步骤会无故 TypeError。钉住 3.11 保证轮子可用。
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install media tools and subtitle font
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/media-tools" --no-save --ignore-scripts --no-audit --no-fund \
            @ffmpeg-installer/linux-x64@4.1.0 @ffprobe-installer/linux-x64@5.2.0
          mkdir -p "$RUNNER_TEMP/media-tools/bin" "$HOME/.local/share/fonts"
          chmod +x "$RUNNER_TEMP/media-tools/node_modules/@ffmpeg-installer/linux-x64/ffmpeg" \
            "$RUNNER_TEMP/media-tools/node_modules/@ffprobe-installer/linux-x64/ffprobe"
          ln -sf "$RUNNER_TEMP/media-tools/node_modules/@ffmpeg-installer/linux-x64/ffmpeg" "$RUNNER_TEMP/media-tools/bin/ffmpeg"
          ln -sf "$RUNNER_TEMP/media-tools/node_modules/@ffprobe-installer/linux-x64/ffprobe" "$RUNNER_TEMP/media-tools/bin/ffprobe"
          echo "$RUNNER_TEMP/media-tools/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/media-tools/bin:$PATH"
          GH_TOKEN="${{ github.token }}" gh api -H 'Accept: application/vnd.github.raw' \
            'repos/notofonts/noto-cjk/contents/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf?ref=f8d157532fbfaeda587e826d4cd5b21a49186f7c' \
            > "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
          if command -v fc-cache >/dev/null; then fc-cache -f "$HOME/.local/share/fonts"; fi
          ffmpeg -hide_banner -filters 2>&1 | grep -q subtitles
          ffprobe -version | head -1
          python -m pip install --no-input --disable-pip-version-check -r production/requirements.txt

      - name: Validate and run the requested mode
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          PAYLOAD_INPUT: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          payload="${PAYLOAD_INPUT:-}"
          if [ -z "$payload" ] && [ -f production/shibuya2006/GEN_REQUEST ]; then
            payload="$(cat production/shibuya2006/GEN_REQUEST)"
          fi
          if [ -z "$payload" ]; then payload='{"mode":"clips","workers":2}'; fi
          mode="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("mode", "clips"))' <<< "$payload")"
          if [ "$mode" != "status" ] && [ "$mode" != "retrieve" ] && [ -f production/shibuya2006/CANCEL_REQUEST ]; then
            echo 'Cancellation requested; no Agnes creation requests will be made.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$mode" = "render" ]; then
            log_file="$RUNNER_TEMP/gwangju-render.log"
            set +e
            python3 production/shibuya2006/build_audio_manifest.py 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              python3 production/shibuya2006/generate.py --render-only --publish 2>&1 | tee -a "$log_file"
              status=${PIPESTATUS[0]}
              if [ "$status" -eq 0 ]; then touch "$RUNNER_TEMP/shibuya-render-done"; fi
            fi
            if [ "$status" -ne 0 ]; then
              mkdir -p production/shibuya2006/qa
              cp "$log_file" production/shibuya2006/qa/render-failure.log
              git add -- production/shibuya2006/qa/render-failure.log
              if ! git diff --cached --quiet -- production/shibuya2006/qa/render-failure.log; then
                git commit -m "shibuya2006: retain render failure diagnostics" -- production/shibuya2006/qa/render-failure.log
                git push origin "HEAD:${{ github.ref_name }}"
              fi
              exit "$status"
            fi
            exit 0
          elif [ "$mode" = "clips" ]; then
            test -n "$AGNES_API_KEY"
            python3 production/shibuya2006/build_story.py
            python3 production/shibuya2006/preflight.py
            python3 production/shibuya2006/generate.py --validate --clips-only
            python3 -u production/shibuya2006/generate.py --clips-only --payload "$payload" --publish
          else
            echo "Unsupported continuation mode: $mode" >&2
            exit 2
          fi

      - name: Keep failure diagnostics in the repo
        # 2026-11-17：GH 把作业日志放在 actions-results 的 blob 存储里，会话侧取不到；
        # 失败时把日志尾部与 git 状态落盘并推回分支，才能在下一轮定位。
        if: failure()
        run: |
          set -uo pipefail
          mkdir -p production/shibuya2006/qa
          {
            echo "# shibuya2006 失败诊断"
            date -u
            echo "## RUNNER_TEMP"
            ls -la "$RUNNER_TEMP" || true
            for f in "$RUNNER_TEMP"/gwangju-render.log "$RUNNER_TEMP"/*.log; do
              [ -f "$f" ] && { echo "## $f"; tail -200 "$f"; }
            done
            echo "## git status"
            git status --porcelain || true
            echo "## head"
            git log --oneline -3 || true
          } > production/shibuya2006/qa/render-failure.log 2>&1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- production/shibuya2006/qa/render-failure.log
          git commit -m 'shibuya2006: keep failure diagnostics' || true
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break
            sleep 3
          done

      - name: Master gate (verify_master)
        # 成片时长/帧数/音轨长度/字幕窗口/字幕与语音同步逐项复核；只有本轮真的出过片才跑。
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/shibuya-render-done" ]; then
            echo 'No render in this run; master gate skipped.'
            exit 0
          fi
          export PATH="$RUNNER_TEMP/media-tools/bin:$PATH"
          film="$(python3 -c "import json;print(json.load(open('production/shibuya2006/story.json'))['film_name'])")"
          test -f "交付/$film"
          python3 production/verify_master.py --film "交付/$film" \
            --story production/shibuya2006/story.json \
            --srt "交付/涩谷短大生惨案_Subtitles.srt" \
            --json production/shibuya2006/qa/verify-master.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- production/shibuya2006/qa/verify-master.json
          if ! git diff --cached --quiet; then
            git commit -m 'shibuya2006: verify_master gate report'
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Upload footage, provenance and QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shibuya2006-${{ github.run_number }}
          path: |
            work/shibuya2006/
            交付/
            production/shibuya2006/results.json
            production/shibuya2006/qa/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
