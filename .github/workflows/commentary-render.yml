name: 解说短片出片
run-name: 出片 · ${{ inputs.project }}

# 通用出片：在**当前分支**上渲染任意 production/<slug> 项目。
# 换题目不需要再动这个文件——在 Actions 里填 slug 就行。
# 具体的流水线步骤都在 production/run_project.sh 里，改流程只改脚本。

on:
  workflow_dispatch:
    inputs:
      project:
        description: '项目目录名（production/ 下的 slug，例如 dahlia）'
        required: true
        default: 'dahlia'
      skip_asr:
        description: '跳过 ASR 对轨（离线时用停顿估算字幕时间）'
        type: boolean
        default: false
      film_name:
        description: '成片文件名（留空则用 story.json 的标题；已交付过的片子请填原名，避免交付目录里出现第二个副本）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: commentary-render-${{ inputs.project }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 90
    env:
      # ASR 对轨要下 Hugging Face 模型。自托管 runner 跑在你自己家/公司的网络上，
      # 连不上 huggingface.co 时把仓库变量 HF_ENDPOINT 设成镜像（如 https://hf-mirror.com）。
      # 不设变量时就是官方地址，行为与切 runner 之前完全一样。
      HF_ENDPOINT: ${{ vars.HF_ENDPOINT || 'https://huggingface.co' }}
      # 模型缓存目录。不设 = 落在本次运行的 work/ 里（每次都重下）；
      # 自托管 runner 把它设成常驻目录（如 /home/you/.cache/whisper）就只下一次。
      WHISPER_CACHE_DIR: ${{ vars.WHISPER_CACHE_DIR }}
    steps:
      - name: Check out the branch this was run from
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install media tools and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          ffmpeg -hide_banner -version | head -1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install render dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pillow>=10,<13" "numpy>=1.26,<3" "faster-whisper>=1.1,<2" || \
          python -m pip install --break-system-packages "pillow>=10,<13" "numpy>=1.26,<3" "faster-whisper>=1.1,<2"

      - name: Validate, restore footage, render with measured audio, publish reports
        env:
          PROJECT: ${{ inputs.project }}
          SKIP_ASR: ${{ inputs.skip_asr }}
          FILM_NAME: ${{ inputs.film_name }}
          BRANCH: ${{ github.ref_name }}
        # 第三个参数留空时 run_project.sh 会用 story.json 的标题（${3:-...}）
        run: bash production/run_project.sh "$PROJECT" "$SKIP_ASR" "$FILM_NAME"

      - name: Upload the finished film
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project }}-成片-${{ github.run_number }}
          path: work/${{ inputs.project }}/*.mp4
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
