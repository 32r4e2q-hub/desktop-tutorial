name: 盖西案 · 提取本片返工参照帧
on:
  workflow_dispatch:
  push:
    branches: [arena/3c0c229a-desktop-tutorial]
    paths: [production/gacy1978/REFERENCE_FRAME_REQUEST]
permissions:
  contents: write
concurrency:
  group: gacy1978-reference-frames
  cancel-in-progress: false
jobs:
  frames:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/3c0c229a-desktop-tutorial
          fetch-depth: 1
      - name: Install frame decoder
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Recover exact HD reference frames from this film only
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess, urllib.request
          from pathlib import Path
          root = Path('production/gacy1978')
          results = json.loads((root/'results.json').read_text())
          out = root/'qa/retake-references'
          out.mkdir(parents=True, exist_ok=True)
          work = Path('work/gacy1978/reference-extract')
          work.mkdir(parents=True, exist_ok=True)
          evidence = {}
          for cid, sid in [('C1','S03'), ('C2','S19'), ('C3','S24')]:
              row = results['shots'][sid]
              assert row['status'] == 'completed'
              video = work/f'{sid}.mp4'
              urllib.request.urlretrieve(row['video_url'], video)
              sha = hashlib.sha256(video.read_bytes()).hexdigest()
              assert sha == row['sha256'], f'{sid}: source SHA mismatch'
              target = out/f'{cid}.jpg'
              subprocess.run(['ffmpeg','-v','error','-y','-ss','0.25','-i',str(video),'-frames:v','1','-q:v','2',str(target)], check=True)
              evidence[cid] = {'shot': sid, 'source_sha256': sha, 'time_seconds': .25,
                               'frame_sha256': hashlib.sha256(target.read_bytes()).hexdigest(),
                               'purpose': 'retake reference only; NOT visual identity approval'}
              print(cid, sid, sha)
          (out/'provenance.json').write_text(json.dumps(evidence, ensure_ascii=False, indent=2)+'\n')
          PY
      - name: Publish only small images and provenance, never source videos
        run: |
          set -euo pipefail
          git config user.name arena-retake-reference
          git config user.email arena@local
          git add production/gacy1978/qa/retake-references
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'gacy1978: extract SHA-verified reference frames for failed-shot retakes'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:arena/3c0c229a-desktop-tutorial; then exit 0; fi
            git fetch origin arena/3c0c229a-desktop-tutorial
            git rebase FETCH_HEAD
          done
          exit 1
