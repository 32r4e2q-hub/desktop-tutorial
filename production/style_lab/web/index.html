<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>参考风格实验室 · 上传参考视频</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1d212a; --line:#2a2f3a;
    --text:#e8eaf0; --dim:#9aa3b2; --accent:#e0a34a; --accent2:#5b9dd9; --ok:#4caf7d; --bad:#e2685f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  header{padding:22px 28px 14px;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:19px;letter-spacing:.5px}
  header p{margin:6px 0 0;color:var(--dim);font-size:12.5px}
  .wrap{display:grid;grid-template-columns:400px 1fr;gap:18px;padding:18px 28px 60px;align-items:start}
  @media (max-width:1080px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .card h2{margin:0 0 12px;font-size:14px;color:var(--accent);letter-spacing:.5px}

  /* 上传区 */
  #drop{border:2px dashed #39404e;border-radius:14px;padding:34px 18px;text-align:center;cursor:pointer;
        transition:.15s;background:#14171d}
  #drop:hover,#drop.over{border-color:var(--accent);background:#1b1f27}
  #drop .ico{font-size:34px;line-height:1}
  #drop b{display:block;margin:10px 0 4px;font-size:15px}
  #drop span{color:var(--dim);font-size:12px}
  .opts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .opts label{flex:1;min-width:130px;font-size:12px;color:var(--dim)}
  select{width:100%;margin-top:4px;background:var(--panel2);color:var(--text);border:1px solid var(--line);
         border-radius:8px;padding:7px 8px;font-size:13px}
  .bar{height:6px;background:#252a34;border-radius:99px;overflow:hidden;margin-top:14px}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .3s}
  #status{margin-top:8px;font-size:12.5px;color:var(--dim);min-height:18px}
  #status.err{color:var(--bad)}
  video{width:100%;border-radius:10px;background:#000;display:none;margin-top:12px}
  .meta{font-size:12px;color:var(--dim);margin-top:8px;word-break:break-all}
  .runs a{display:block;color:var(--dim);text-decoration:none;font-size:12.5px;padding:5px 0;border-bottom:1px dashed #262b34}
  .runs a:hover{color:var(--text)}

  /* 结果 */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:12px;color:var(--dim)}
  .palette{display:flex;gap:6px;margin:10px 0 4px}
  .sw{width:52px;text-align:center;font-size:10.5px;color:var(--dim)}
  .sw i{display:block;height:38px;border-radius:7px;border:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #242932;vertical-align:top}
  th{color:var(--dim);font-weight:500;width:88px}
  td b{color:var(--text);font-weight:600}
  img.sheet{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
  .md{font-size:13px;line-height:1.75}
  .md h1{font-size:17px;margin:16px 0 8px}
  .md h2{font-size:15px;margin:20px 0 8px;color:var(--accent)}
  .md h3{font-size:13.5px;margin:16px 0 6px;color:var(--accent2)}
  .md table{margin:8px 0 14px}
  .md pre{background:#0b0d12;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:11.5px;white-space:pre-wrap}
  .md ul{padding-left:18px;margin:6px 0}
  .md li{margin:3px 0}
  .cand{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--panel2)}
  .cand.picked{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
  .cand h3{margin:0 0 6px;font-size:14px}
  .cand .risk{color:var(--accent);font-size:12px;margin:6px 0}
  .cand pre{background:#0b0d12;border:1px solid var(--line);border-radius:8px;padding:10px;
            overflow:auto;font-size:11.5px;white-space:pre-wrap;margin:8px 0}
  .row{display:flex;gap:8px;margin-top:8px}
  button{background:var(--accent);color:#1a1206;border:none;border-radius:8px;padding:7px 14px;
         font-size:12.5px;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
  button.ghost:hover{color:var(--text);border-color:var(--accent)}
  .hidden{display:none}
  .empty{color:var(--dim);font-size:13px;text-align:center;padding:30px 0}
</style>
</head>
<body>
<header>
  <h1>参考风格实验室</h1>
  <p>把参考片拖进来 → 量出它的调子、光线、运动、颗粒 → 给三组「逼真 3D 动画」英文提示词候选。参考片只用于分析，一帧都不进新片。</p>
</header>

<div class="wrap">
  <!-- 左：上传区 -->
  <div>
    <div class="card">
      <h2>① 上传参考视频</h2>
      <div id="drop">
        <div class="ico">🎬</div>
        <b>把视频拖到这里</b>
        <span>或点击选择文件 · mp4 / mov / mkv / webm / avi</span>
      </div>
      <input id="file" type="file" accept="video/*" class="hidden" />
      <div class="opts">
        <label>抽帧数量
          <select id="samples">
            <option value="24">24 帧（快）</option>
            <option value="48" selected>48 帧（推荐）</option>
            <option value="72">72 帧（细）</option>
          </select>
        </label>
        <label>硬切阈值
          <select id="threshold">
            <option value="0.18">0.18（灵敏）</option>
            <option value="0.24" selected>0.24（同 dahlia）</option>
            <option value="0.30">0.30（只算大切换）</option>
          </select>
        </label>
      </div>
      <div class="bar"><i id="bar"></i></div>
      <div id="status">还没有文件。</div>
      <video id="player" controls playsinline></video>
      <div class="meta" id="filemeta"></div>
    </div>

    <div class="card">
      <h2>历史分析</h2>
      <div class="runs" id="runs"><span style="color:var(--dim);font-size:12.5px">（暂无）</span></div>
    </div>
  </div>

  <!-- 右：结果 -->
  <div id="results">
    <div class="card"><div class="empty">左边传一个视频，这里会长出风格档案。</div></div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const drop = $('#drop'), fileInput = $('#file'), bar = $('#bar'), statusEl = $('#status');
let currentRun = null, pollTimer = null;

/* ---------- 上传 ---------- */
drop.addEventListener('click', () => fileInput.click());
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { if (e.dataTransfer.files.length) upload(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', () => { if (fileInput.files.length) upload(fileInput.files[0]); });

function upload(file){
  const fd = new FormData();
  fd.append('file', file);
  fd.append('samples', $('#samples').value);
  fd.append('threshold', $('#threshold').value);
  statusEl.className = ''; statusEl.textContent = `正在上传 ${file.name}…`;
  bar.style.width = '0%';
  $('#results').innerHTML = '<div class="card"><div class="empty">分析中…</div></div>';

  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/upload');
  xhr.upload.onprogress = e => {
    if (e.lengthComputable) {
      const p = Math.round(e.loaded / e.total * 100);
      bar.style.width = p + '%';
      statusEl.textContent = `上传中 ${p}%（${(e.total/1048576).toFixed(1)} MB）`;
    }
  };
  xhr.onload = () => {
    if (xhr.status >= 400) { fail(`上传失败：${xhr.responseText}`); return; }
    const res = JSON.parse(xhr.responseText);
    currentRun = res.run_id;
    statusEl.textContent = '上传完成，开始分析…';
    bar.style.width = '100%';
    poll();
  };
  xhr.onerror = () => fail('上传失败：网络中断');
  xhr.send(fd);
}

function fail(msg){
  statusEl.className = 'err'; statusEl.textContent = msg; bar.style.width='0%';
  $('#results').innerHTML = '<div class="card"><div class="empty">没跑起来。</div></div>';
}

/* ---------- 轮询进度 ---------- */
function poll(){
  clearTimeout(pollTimer);
  fetch(`/api/state/${currentRun}`).then(r => r.json()).then(st => {
    if (st.state === 'error') { fail(st.detail || '分析失败'); return; }
    bar.style.width = (st.pct || 0) + '%';
    statusEl.textContent = `${st.stage || ''} ${(st.pct || 0).toFixed(0)}% ${st.detail || ''}`;
    if (st.state === 'done') { loadReport(); }
    else pollTimer = setTimeout(poll, 1200);
  }).catch(() => pollTimer = setTimeout(poll, 2000));
}

/* ---------- 报告 ---------- */
function loadReport(){
  fetch(`/api/report/${currentRun}`).then(r => r.json()).then(show).catch(e => fail('报告读取失败：' + e));
  loadRuns();
}

function fmt(n, d=0){ return (n === null || n === undefined) ? '—' : Number(n).toFixed(d); }

function show(rep){
  const m = rep.metrics, c = m.color, t = m.texture, mo = m.motion, rh = m.rhythm, ct = m.container, s = m.source;
  const mins = (ct.duration/60).toFixed(1);
  const swatches = (c.palette||[]).map(p =>
    `<div class="sw"><i style="background:${p.hex}"></i>${p.hex}<br>${(p.share*100).toFixed(0)}%</div>`).join('');

  const cands = (rep.candidates.candidates || []).map(cd => `
    <div class="cand" id="cand-${cd.id}">
      <h3>${cd.label}</h3>
      <div style="color:var(--dim);font-size:12.5px">${cd.摘要}</div>
      <div class="risk">风险：${cd.风险}</div>
      <div style="font-size:11px;color:var(--dim);letter-spacing:.5px">STYLE_PREFIX</div>
      <pre>${escapeHtml(cd.style_prefix)}</pre>
      <div style="font-size:11px;color:var(--dim);letter-spacing:.5px">NEGATIVE_PROMPT</div>
      <pre>${escapeHtml(cd.negative_prompt)}</pre>
      <div class="row">
        <button data-copy="prefix-${cd.id}">复制 STYLE_PREFIX</button>
        <button class="ghost" data-copy="neg-${cd.id}">复制 NEGATIVE_PROMPT</button>
        <button class="ghost" data-pick="${cd.id}">选定这组</button>
      </div>
      <textarea class="hidden" id="prefix-${cd.id}">${cd.style_prefix}</textarea>
      <textarea class="hidden" id="neg-${cd.id}">${cd.negative_prompt}</textarea>
    </div>`).join('');

  $('#results').innerHTML = `
    <div class="card">
      <h2>② 实测结果</h2>
      <div class="chips">
        <span class="chip">${s.file}</span>
        <span class="chip">${s.mb} MB</span>
        <span class="chip">${ct.width}×${ct.height}</span>
        <span class="chip">${ct.fps} fps</span>
        <span class="chip">${mins} 分钟</span>
        <span class="chip">${ct.video_codec || '视频'}</span>
        <span class="chip">${ct.has_audio ? '有音轨（不迁移）' : '无音轨'}</span>
      </div>
      <div class="palette">${swatches}</div>
      <table>
        <tr><th>影调</th><td>平均亮度 <b>${fmt(c.mean_luma,1)}</b>/255 · 帧内反差 <b>${fmt(c.mean_contrast,1)}</b></td></tr>
        <tr><th>色彩</th><td>饱和 <b>${fmt(c.mean_saturation,1)}</b>/255 · 色温 R−B <b>${c.warmth_r_minus_b>0?'+':''}${fmt(c.warmth_r_minus_b,1)}</b>（正=暖 负=冷）</td></tr>
        <tr><th>质感</th><td>锐度 <b>${fmt(t.mean_sharpness,0)}</b> · 颗粒残差 <b>${fmt(t.mean_grain,2)}</b> · 中心/边缘锐度 <b>${fmt(t.dof_center_over_edge,2)}</b></td></tr>
        <tr><th>明暗分布</th><td>暗部 ${(c.tone_split.shadow*100).toFixed(0)}% · 中低 ${(c.tone_split.low_mid*100).toFixed(0)}% · 中高 ${(c.tone_split.high_mid*100).toFixed(0)}% · 高光 ${(c.tone_split.highlight*100).toFixed(0)}%</td></tr>
        <tr><th>运动</th><td>帧间差 <b>${fmt(mo.mean_interframe_diff,3)}</b>（峰值 ${fmt(mo.max_interframe_diff,3)}，${m.sampling.motion_pairs} 组采样）</td></tr>
        <tr><th>节奏</th><td>估算 <b>${rh.estimated_cuts}</b> 次切换 · 中位镜头 <b>${rh.estimated_median_shot_seconds ?? '—'}</b> 秒${rh.partial?'（部分结果，超时中断）':''}</td></tr>
      </table>
    </div>

    <div class="card">
      <h2>③ 接触表（${m.sampling.sampled_frames} 帧）</h2>
      ${rep.contact_sheet
        ? `<a href="${rep.contact_sheet}" target="_blank"><img class="sheet" src="${rep.contact_sheet}" alt="接触表"></a>`
        : '<div class="empty">这一跑没有留下接触表。</div>'}
      <div style="color:var(--dim);font-size:12px;margin-top:8px">点开看大图，逐格核对：场景、光线、有没有换场。</div>
    </div>

    <div class="card">
      <h2>④ 风格档案</h2>
      <div class="md" id="md"></div>
    </div>

    <div class="card">
      <h2>⑤ 三组提示词候选</h2>
      ${cands || '<div class="empty">候选还没生成。</div>'}
    </div>`;

  $('#md').innerHTML = renderMd(rep.markdown);
  if (rep.video) { $('#player').src = rep.video; $('#player').style.display = 'block'; }
  else { $('#player').removeAttribute('src'); $('#player').style.display = 'none'; }
  $('#filemeta').innerHTML = `${s.file} · SHA-256 <code>${(rep.metrics.source && rep.metrics.source.sha256) || '—'}</code>`;

  document.querySelectorAll('[data-copy]').forEach(btn => btn.onclick = () => {
    const id = btn.dataset.copy;
    navigator.clipboard.writeText(document.getElementById(id).value);
    const old = btn.textContent; btn.textContent = '已复制 ✓';
    setTimeout(() => btn.textContent = old, 1400);
  });
  document.querySelectorAll('[data-pick]').forEach(btn => btn.onclick = () => {
    fetch(`/api/choose/${currentRun}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({candidate: btn.dataset.pick})
    }).then(r => r.json()).then(res => {
      document.querySelectorAll('.cand').forEach(c => c.classList.remove('picked'));
      document.getElementById('cand-' + res.candidate).classList.add('picked');
      statusEl.className=''; statusEl.textContent = `已选定：${res.label}（写在 runs/${currentRun}/chosen.json）`;
      loadRuns();
    });
  });

  if (rep.chosen) {
    const el = document.getElementById('cand-' + rep.chosen.candidate);
    if (el) el.classList.add('picked');
  }
}

/* ---------- 迷你 markdown 渲染 ---------- */
function escapeHtml(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function inline(s){
  return escapeHtml(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}
function renderMd(text){
  const lines = text.split('\n');
  let out = '', inCode = false, inList = false, table = [];
  const flushTable = () => {
    if (!table.length) return;
    const rows = table.filter(r => !/^\|[\s|:-]+\|$/.test(r));
    out += '<table>';
    rows.forEach((r, i) => {
      const cells = r.split('|').slice(1, -1).map(c => `<${i?'td':'th'}>${inline(c.trim())}</${i?'td':'th'}>`).join('');
      out += `<tr>${cells}</tr>`;
    });
    out += '</table>';
    table = [];
  };
  for (const raw of lines) {
    const line = raw.trimEnd();
    if (line.startsWith('```')) { inCode ? out += '</pre>' : (flushTable(), out += '<pre>'); inCode = !inCode; continue; }
    if (inCode) { out += escapeHtml(raw) + '\n'; continue; }
    if (/^\s*\|/.test(line)) { table.push(line.trim()); continue; } else flushTable();
    if (/^###\s/.test(line)) { out += `<h3>${inline(line.replace(/^###\s/,''))}</h3>`; continue; }
    if (/^##\s/.test(line)) { out += `<h2>${inline(line.replace(/^##\s/,''))}</h2>`; continue; }
    if (/^#\s/.test(line)) { out += `<h1>${inline(line.replace(/^#\s/,''))}</h1>`; continue; }
    if (/^[-*]\s/.test(line)) {
      if (!inList) { out += '<ul>'; inList = true; }
      out += `<li>${inline(line.replace(/^[-*]\s/,''))}</li>`; continue;
    } else if (inList) { out += '</ul>'; inList = false; }
    if (!line.trim()) continue;
    out += `<p>${inline(line)}</p>`;
  }
  if (inList) out += '</ul>';
  flushTable();
  if (inCode) out += '</pre>';
  return out;
}

/* ---------- 历史 ---------- */
function loadRuns(){
  fetch('/api/runs').then(r => r.json()).then(data => {
    const el = $('#runs');
    if (!data.runs.length) { el.innerHTML = '<span style="color:var(--dim);font-size:12.5px">（暂无）</span>'; return; }
    el.innerHTML = data.runs.map(r =>
      `<a href="#" data-run="${r.run_id}">${r.file || r.run_id} · ${r.duration ? (r.duration/60).toFixed(1)+' 分钟' : r.state}${r.chosen ? ' · 已选 '+r.chosen : ''}</a>`
    ).join('');
    el.querySelectorAll('[data-run]').forEach(a => a.onclick = e => {
      e.preventDefault(); currentRun = a.dataset.run; loadReport();
    });
  });
}
loadRuns();
</script>
</body>
</html>
