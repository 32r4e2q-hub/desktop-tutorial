# 模板：production/new_topic.py 会把 sinjeong2005 / arena/f3e80641-desktop-tutorial / f3e80641-desktop-tutorial / 新亭洞连环杀人案：凶手找到了，却已死去十年 / 新亭洞连环杀人案_凶手找到了，却已死去十年_三分钟_带声音.mp4 换成新项目的值，
# 生成 production/<slug>/workflows/<slug>-*.yml；复制到 .github/workflows/ 后即可用 marker 文件 push 触发。
name: 新亭洞连环杀人案：凶手找到了，却已死去十年 · 智谱生成
run-name: 新亭洞连环杀人案：凶手找到了，却已死去十年 · 智谱 CogVideoX-Flash 生成 · ${{ github.ref_name }}

# 触发方式：在分支上写 production/sinjeong2005/GEN_REQUEST（内容就是 JSON payload）并 push。
#   全量：{"workers":2}        补做个别镜头：{"workers":1,"only":"S07,S12"}
# 沙箱连不上智谱 API、也读不到 Actions 日志，所以回执 results.json 与 qa 接触表由本工作流 commit 回分支；
# 视频文件留在智谱 CDN（results.json 里有地址+SHA-256，出片时按回执回填）。
# 中途失败可断点续跑：再改一下 GEN_REQUEST 重新 push，已完成的镜头按 SHA-256 复用、不重新生成。

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON: {"only":"S01","workers":1}；空则读 GEN_REQUEST'
        type: string
        default: '{"workers":1}'
  push:
    branches:
      - arena/f3e80641-desktop-tutorial
    paths:
      - production/sinjeong2005/GEN_REQUEST

permissions:
  contents: write

concurrency:
  group: sinjeong2005-zhipu-arena-f3e80641-desktop-tutorial
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/arena/f3e80641-desktop-tutorial'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 350
    steps:
      - name: Check out this Arena production branch
        uses: actions/checkout@v4
        with:
          ref: arena/f3e80641-desktop-tutorial
          fetch-depth: 1

      - name: Resolve the generation payload
        env:
          PAYLOAD_INPUT: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          if [ -n "${PAYLOAD_INPUT:-}" ]; then
            payload="$PAYLOAD_INPUT"
          elif [ -f production/sinjeong2005/GEN_REQUEST ]; then
            payload="$(tr -d '\n' < production/sinjeong2005/GEN_REQUEST)"
          else
            payload='{"workers":1}'
          fi
          echo "PAYLOAD=$payload" >> "$GITHUB_ENV"
          echo "Generation payload: $payload"

      - name: Install media tools and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          ffmpeg -hide_banner -version | head -1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install render dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "zhipuai" "sniffio" "httpx" "requests" "pillow>=10,<13" "numpy>=1.26,<3" "av>=12,<16"

      - name: Validate the complete three-minute timeline
        run: python3 production/sinjeong2005/generate.py --validate

      - name: Drop dead provider tasks so a re-run submits fresh ones
        run: python3 production/sinjeong2005/generate.py --prune-failed

      - name: Generate Zhipu clips and checkpoint provenance
        env:
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
          PAYLOAD: ${{ env.PAYLOAD }}
        run: python3 -u production/sinjeong2005/generate.py --publish --payload "$PAYLOAD" 2>&1 | tee /tmp/gen.log; exit ${PIPESTATUS[0]}

      - name: Ship failure log to branch (sandbox cannot read Actions logs)
        if: failure()
        run: |
          tail -c 200000 /tmp/gen.log > production/sinjeong2005/gen-diag.log
          git config user.name "arena-diag"
          git config user.email "arena@local"
          git add -f production/sinjeong2005/gen-diag.log
          git commit -m "sinjeong2005: 智谱生成失败诊断 $(date -u +%FT%TZ)"
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${{ github.ref_name }}"; then pushed=1; break; fi
            git fetch origin ${{ github.ref_name }} && git rebase FETCH_HEAD || break
          done
          [ "$pushed" = "1" ] || echo "::error::诊断日志推不回分支，看本次运行的 artifact"

      - name: Save video clips as downloadable artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sinjeong2005-zhipu-${{ github.run_number }}
          path: |
            work/sinjeong2005/sources/
            production/sinjeong2005/results.json
            production/sinjeong2005/qa/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
