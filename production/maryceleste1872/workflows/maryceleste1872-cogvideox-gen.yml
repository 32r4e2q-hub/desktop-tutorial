# 38 镜全部走智谱 CogVideoX-Flash 免费档（2026-10-11 用户拍板；Agnes 三镜留作备用）。
# 引擎 production/maryceleste1872/generate_cogvideox.py，移植自已实测跑通的 jeong2000 流水线。
name: 玛丽·赛勒斯特号：海上最大的未解之谜 · CogVideoX生成
run-name: 玛丽号 · 智谱 CogVideoX-Flash 生成 · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON: {"only":"S01"}；空则全量 38 镜'
        type: string
        default: ''
  push:
    branches:
      - arena/63ceeca2-desktop-tutorial
    paths:
      - production/maryceleste1872/COGVIDEOX_GEN_REQUEST

permissions:
  contents: write

concurrency:
  group: maryceleste1872-cogvideox-arena-63ceeca2-desktop-tutorial
  # 长生成不排队等：断点续跑靠 SHA-256 收据，取消不丢已完成的镜头。
  cancel-in-progress: true

jobs:
  generate:
    if: github.ref == 'refs/heads/arena/63ceeca2-desktop-tutorial'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 350
    steps:
      - name: Check out this Arena production branch
        uses: actions/checkout@v4
        with:
          ref: arena/63ceeca2-desktop-tutorial
          fetch-depth: 0  # 全量历史：checkpoint 推送被拒后 fetch+rebase 才能成功

      - name: Resolve generation payload
        env:
          PAYLOAD_INPUT: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          if [ -n "${PAYLOAD_INPUT:-}" ]; then payload="$PAYLOAD_INPUT";
          elif [ -f production/maryceleste1872/COGVIDEOX_GEN_REQUEST ]; then payload="$(tr -d '\n' < production/maryceleste1872/COGVIDEOX_GEN_REQUEST)";
          else payload='{}'; fi
          echo "PAYLOAD=$payload" >> "$GITHUB_ENV"
          echo "Generation payload: $payload"

      - name: Install media tools and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CogVideoX and inspection dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "zhipuai>=2.1" "requests>=2.31" "sniffio>=1.3" "httpx>=0.27" "pillow>=10,<13" "numpy>=1.26,<3" "av>=12,<19"

      - name: 角色脸一致性（静态闸门）
        run: python3 production/face_cast.py check-prompts --project production/maryceleste1872

      - name: Validate the complete three-minute timeline
        run: python3 production/maryceleste1872/generate_cogvideox.py --validate

      - name: Generate 38 CogVideoX-Flash clips and checkpoint receipts
        env:
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
          PAYLOAD: ${{ env.PAYLOAD }}
        run: |
          set -o pipefail
          python3 -u production/maryceleste1872/generate_cogvideox.py --publish --payload "$PAYLOAD" 2>&1 | tee /tmp/gen.log
          exit ${PIPESTATUS[0]}

      - name: Ship failure log to branch (sandbox cannot read Actions logs)
        if: failure()
        run: |
          tail -c 200000 /tmp/gen.log > production/maryceleste1872/gen-diag-cogvideox.log || true
          git config user.name "arena-diag"
          git config user.email "arena@local"
          git add -f production/maryceleste1872/gen-diag-cogvideox.log
          git commit -m "maryceleste1872: CogVideoX 生成失败诊断 $(date -u +%FT%TZ)" || true
          git push origin HEAD:arena/63ceeca2-desktop-tutorial || true

      - name: Save generation evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: maryceleste1872-cogvideox-${{ github.run_number }}
          path: |
            production/maryceleste1872/results.json
            production/maryceleste1872/qa/
            production/maryceleste1872/gen-diag-cogvideox.log
          if-no-files-found: warn
          retention-days: 14
