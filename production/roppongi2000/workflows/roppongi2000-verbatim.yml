# 模板：production/new_topic.py 会把 roppongi2000 / 六本木洞窟迷案：英国空姐在东京消失，七个月后现身海蚀洞 / 六本木洞窟迷案_英国空姐在东京消失，七个月后现身海蚀洞_三分钟_带声音.mp4 换成新项目的值，
# 生成 production/<slug>/workflows/<slug>-verbatim.yml；复制到 .github/workflows/ 后即可用 marker/手动触发。
#
# 把成片里的解说转写成文字，与剧本逐字比对，回答"配音念的字和剧本一字不差吗"。
# 为什么必须在 Actions 上做：ASR 模型要从 Hugging Face 下载，本地沙箱连不上（网络策略拦截）。
# 刻意不给 whisper 喂 initial_prompt：让模型"复述"剧本是循环论证（对轨可以，取证不行）。
name: 六本木洞窟迷案：英国空姐在东京消失，七个月后现身海蚀洞 · 逐字听检
run-name: 听检 · roppongi2000 · ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - arena/f9f847e0-desktop-tutorial
    paths:
      - production/roppongi2000/VERBATIM_REQUEST

permissions:
  contents: write

concurrency:
  group: roppongi2000-verbatim-arena-f9f847e0-desktop-tutorial
  cancel-in-progress: false

jobs:
  listen:
    if: github.ref == 'refs/heads/arena/f9f847e0-desktop-tutorial'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      HF_ENDPOINT: ${{ vars.HF_ENDPOINT || 'https://huggingface.co' }}
      HF_HUB_DISABLE_XET: ${{ vars.HF_HUB_DISABLE_XET || '1' }}
      WHISPER_CACHE_DIR: ${{ vars.WHISPER_CACHE_DIR }}
    steps:
      - name: Check out the branch this was run from
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install ffmpeg and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r production/requirements.txt
          python -m pip install "faster-whisper>=1.1,<2" || \
          python -m pip install --break-system-packages "faster-whisper>=1.1,<2"

      - name: Transcribe the delivered film and compare it to the script
        id: check
        continue-on-error: true        # 报告一定先落盘，再决定这次运行算不算失败
        env:
          PROJECT: roppongi2000
          FILM: 交付/六本木洞窟迷案_英国空姐在东京消失，七个月后现身海蚀洞_三分钟_带声音.mp4
          MODEL: small
          MAX_CER: "0.15"
        run: |
          python3 -u production/verbatim_check.py \
            --film "$FILM" \
            --project "production/$PROJECT" \
            --work "work/$PROJECT/verbatim" \
            --narration "production/$PROJECT/audio" \
            --model "$MODEL" \
            --max-cer "$MAX_CER"

      - name: Publish the report back to the branch
        env:
          PROJECT: roppongi2000
          BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p "production/$PROJECT/delivery"
          cp "work/$PROJECT/verbatim/verbatim-check.json" "production/$PROJECT/delivery/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "production/$PROJECT/delivery/verbatim-check.json"
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Add the verbatim listening check for $PROJECT"
            git push origin "HEAD:$BRANCH"
            echo "PUBLISHED_COMMIT $(git rev-parse HEAD)"
          fi

      - name: Upload the transcript slices and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roppongi2000-verbatim-${{ github.run_number }}
          path: |
            work/roppongi2000/verbatim/
            production/roppongi2000/delivery/verbatim-check.json
          if-no-files-found: warn
          retention-days: 14
