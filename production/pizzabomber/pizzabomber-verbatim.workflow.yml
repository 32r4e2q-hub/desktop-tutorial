name: 披萨炸弹 · 逐字听检
run-name: 听检 · 披萨炸弹劫案

# 把成片里的解说转写成文字，与 story.json 逐字比对（CER），报告 commit 回分支。
# 代理触发方式：改一下 production/pizzabomber/VERBATIM_REQUEST push 上来。

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'whisper 模型：tiny / base / small / medium / large-v3'
        type: string
        default: 'small'
      max_cer:
        description: '字错率上限，超过就要求人工听那一段'
        type: string
        default: '0.15'
  push:
    branches:
      - arena/01a0a242-desktop-tutorial
    paths:
      - production/pizzabomber/VERBATIM_REQUEST

permissions:
  contents: write

concurrency:
  group: pizzabomber-verbatim-arena-01a0a242-desktop-tutorial
  cancel-in-progress: false

jobs:
  listen:
    if: github.ref == 'refs/heads/arena/01a0a242-desktop-tutorial'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out this Arena production branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a0a242-desktop-tutorial
          fetch-depth: 1

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -version | head -1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r production/requirements.txt
          python -m pip install "faster-whisper>=1.1,<2" || \
          python -m pip install --break-system-packages "faster-whisper>=1.1,<2"

      - name: Transcribe the delivered film and compare it to the script
        id: check
        continue-on-error: true
        env:
          MODEL: ${{ inputs.model || 'small' }}
          MAX_CER: ${{ inputs.max_cer || '0.15' }}
        run: |
          python3 -u production/verbatim_check.py \
            --film "交付/披萨炸弹劫案_三分钟_带声音.mp4" \
            --project production/pizzabomber \
            --work work/pizzabomber/verbatim \
            --narration production/pizzabomber/audio \
            --model "$MODEL" \
            --max-cer "$MAX_CER"

      - name: Publish the report back to the branch
        env:
          BRANCH: arena/01a0a242-desktop-tutorial
        run: |
          mkdir -p production/pizzabomber/delivery
          cp work/pizzabomber/verbatim/verbatim-check.json production/pizzabomber/delivery/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/pizzabomber/delivery/verbatim-check.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Add the verbatim listening check for pizzabomber"
            for attempt in 1 2 3; do
              if git push origin "HEAD:$BRANCH"; then
                echo "PUBLISHED_COMMIT $(git rev-parse HEAD)"; exit 0
              fi
              git pull --rebase origin "$BRANCH"
            done
            echo "::error::听检报告推不回分支（并发提交冲突），看本次运行的 artifact"; exit 1
          fi

      - name: Upload the slices and the report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pizzabomber-逐字听检-${{ github.run_number }}
          path: work/pizzabomber/verbatim
          if-no-files-found: warn
          retention-days: 30

      - name: Fail if a chapter needs a human ear
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::有段落的字错率超过上限，看 production/pizzabomber/delivery/verbatim-check.json"
          exit 1
