# 模板：production/new_topic.py 会把 __SLUG__ / __TITLE__ / __FILM__ 换成新项目的值，
# 生成 production/<slug>/workflows/<slug>-visual-qc.yml；复制到 .github/workflows/ 后用 marker 触发。
#
# 成片渲染完之后跑：对源片与成片做自动技术 QC（解码、黑白帧、冻结窗、字幕窗口/语音能量、时长/分辨率/帧率），
# 输出 qa/qc-report.json 与 qa/qc-summary.md 并 commit 回分支。
# 自动结果只是**分诊**，不是签收：AI 伪文字、手指与面部形变、字幕与画面遮挡这类缺陷，自动审计量不到，
# 交付前必须人工完整播放复核。
name: __TITLE__ · 成片技术QC
run-name: 成片技术QC · __SLUG__ · ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - __BRANCH__
    paths:
      - production/__SLUG__/VISUAL_QC_REQUEST

permissions:
  contents: write

concurrency:
  group: __SLUG__-visual-qc-arena-__SHORT_BRANCH__
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/__BRANCH__'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - name: Check out this production branch
        uses: actions/checkout@v4
        with:
          ref: __BRANCH__
          fetch-depth: 1

      - name: Install ffmpeg, Python and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install -r production/requirements.txt

      - name: Run the source and final-film QC
        run: python3 production/__SLUG__/qc.py

      - name: Commit the QC report back to the branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/__SLUG__/qa/qc-report.json production/__SLUG__/qa/qc-summary.md
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "__SLUG__: visual QC report"
            for attempt in 1 2 3; do
              if git push origin "HEAD:__BRANCH__"; then break; fi
              git fetch origin __BRANCH__ || true
              git pull --rebase origin __BRANCH__ || git rebase --abort || true
            done
          fi

      - name: Upload the QC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: __SLUG__-visual-qc-${{ github.run_number }}
          path: production/__SLUG__/qa/
          if-no-files-found: warn
          retention-days: 14
