# 模板：production/new_topic.py 会把 monalisa / arena/01a0dbbf-desktop-tutorial / 01a0dbbf-desktop-tutorial / 蒙娜丽莎失窃案：一枚左手拇指印 / 蒙娜丽莎失窃案_一枚左手拇指印_三分钟_带声音.mp4 换成新项目的值，
# 生成 production/<slug>/workflows/<slug>-*.yml；复制到 .github/workflows/ 后即可用 marker 文件 push 触发。
name: 蒙娜丽莎失窃案：一枚左手拇指印 · 逐字听检
run-name: 逐字听检 · 蒙娜丽莎失窃案：一枚左手拇指印 · ${{ github.ref_name }}

# 通用的 verbatim-check.yml 只能 workflow_dispatch，而沙箱里的 token 没有 actions:write
# （HTTP 403: Resource not accessible by integration，2026-09-21 实测），所以照冷案 DNA 分支的
# <slug>-verbatim.yml 做成 marker 触发：在分支上写/改 production/monalisa/VERBATIM_REQUEST 并 push。
# 结果 production/monalisa/delivery/verbatim-check.json 由 runner commit 回分支。

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0dbbf-desktop-tutorial
    paths:
      - production/monalisa/VERBATIM_REQUEST

permissions:
  contents: write

concurrency:
  group: monalisa-verbatim-arena-01a0dbbf-desktop-tutorial
  cancel-in-progress: false

jobs:
  verbatim:
    if: github.ref == 'refs/heads/arena/01a0dbbf-desktop-tutorial'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      HF_ENDPOINT: ${{ vars.HF_ENDPOINT || 'https://huggingface.co' }}
      HF_HUB_DISABLE_XET: ${{ vars.HF_HUB_DISABLE_XET || '1' }}
      WHISPER_CACHE_DIR: ${{ vars.WHISPER_CACHE_DIR }}
    steps:
      - name: 先让 git 走 HTTP/1.1（国内网络下 HTTP/2 会静默卡死）
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 30

      - name: Check out this Arena production branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a0dbbf-desktop-tutorial
          fetch-depth: 1

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -version | head -1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r production/requirements.txt
          python -m pip install "faster-whisper>=1.1,<2" "zhconv>=1.4" || \
          python -m pip install --break-system-packages "faster-whisper>=1.1,<2" "zhconv>=1.4"

      - name: Pick the listening model (VERBATIM_REQUEST {"model":...}, default medium)
        # 本片：出片前的配音 ASR 探针里，small 对专名（卢浮宫/佩鲁贾/蒙娜丽莎）大量同音误听，N02 的 CER 在
        # 0.15–0.16 之间随机摆动（whisper 温度回退有随机性）——拿它当闸门等于掷硬币；medium 同一批配音
        # CER 0.008–0.056、无声调音节错误率 0–2.6%。更准的听写员是更严的闸门，不是放水。
        run: |
          model="$(python3 -c "import json;print(json.load(open('production/monalisa/VERBATIM_REQUEST')).get('model','medium'))" 2>/dev/null || echo medium)"
          echo "VERBATIM_MODEL=$model" >> "$GITHUB_ENV"
          echo "listening model: $model"

      - name: Transcribe the delivered film and compare it to the script
        id: check
        continue-on-error: true        # 报告一定先落盘，再决定这次运行算不算失败
        run: |
          python3 -u production/verbatim_check.py \
            --film "交付/蒙娜丽莎失窃案_一枚左手拇指印_三分钟_带声音.mp4" \
            --project production/monalisa \
            --work work/monalisa/verbatim \
            --narration production/monalisa/audio \
            --model "$VERBATIM_MODEL" \
            --max-cer 0.15

      - name: Commit verbatim-check.json back to the branch
        run: |
          git config user.name "arena-verbatim"
          git config user.email "arena@local"
          mkdir -p production/monalisa/delivery
          cp work/monalisa/verbatim/verbatim-check.json production/monalisa/delivery/verbatim-check.json
          git add -f production/monalisa/delivery/verbatim-check.json
          git commit -m "听检: 蒙娜丽莎失窃案：一枚左手拇指印 逐字听检报告 (faster-whisper $VERBATIM_MODEL)" || true
          pushed=0
          for attempt in 1 2 3 4 5 6; do
            if git push origin "HEAD:${{ github.ref_name }}"; then pushed=1; break; fi
            git fetch origin ${{ github.ref_name }} && git rebase FETCH_HEAD || break
            sleep 10
          done
          [ "$pushed" = "1" ] || echo "::error::未能成功推送听检报告"

      - name: Fail the run if the transcript did not match the script
        if: steps.check.outcome != 'success'
        run: |
          echo "::error::逐字听检未通过或未能完成，报告已 commit 到 production/monalisa/delivery/verbatim-check.json"
          exit 1
