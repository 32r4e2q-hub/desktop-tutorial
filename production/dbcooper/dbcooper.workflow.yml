name: DB库珀劫机案：1971年消失的劫机者 · 出片
run-name: DB库珀劫机案：1971年消失的劫机者 · 出片（含音量实测）

# 真正的流程在 production/run_project.sh，改流程只改脚本，不必再动 workflows。

on:
  workflow_dispatch:
    inputs:
      skip_asr:
        description: '跳过 ASR 对轨（离线时用停顿估算字幕时间）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dbcooper-arena-01a08e48-desktop-tutorial
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == 'refs/heads/arena/01a08e48-desktop-tutorial'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install media tools and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          ffmpeg -hide_banner -version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install render dependencies
        run: |
          python -m pip install "pillow>=10,<13" "numpy>=1.26,<3" "faster-whisper>=1.1,<2" || \
          python -m pip install --break-system-packages "pillow>=10,<13" "numpy>=1.26,<3" "faster-whisper>=1.1,<2"

      - name: Validate, restore footage, render, publish reports
        env:
          SKIP_ASR: ${{ inputs.skip_asr }}
          BRANCH: arena/01a08e48-desktop-tutorial
        run: bash production/run_project.sh dbcooper "$SKIP_ASR"

      - name: Upload the finished film
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DB库珀劫机案：1971年消失的劫机者-成片
          path: work/dbcooper/*.mp4
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
